<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>ONE Study</title>

<style>

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background: #f4f7fb;
  color: #172033;
}


/* =========================
   HEADER
   ========================= */

.header {
  background:
    linear-gradient(
      135deg,
      #2563eb,
      #4338ca
    );

  color: #ffffff;
  padding: 42px 20px 58px;
  text-align: center;
}

.logo {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 18px;
  font-weight: 500;
  opacity: 0.95;
}


/* =========================
   MAIN
   ========================= */

.container {
  max-width: 720px;
  margin: -32px auto 40px;
  padding: 0 16px;
}

.card {
  background: #ffffff;
  border-radius: 26px;
  padding: 26px;

  box-shadow:
    0 12px 35px
    rgba(15, 23, 42, 0.09);
}


/* =========================
   QUESTION
   ========================= */

h2 {
  margin: 0 0 20px;
  font-size: 25px;
  line-height: 1.5;
  font-weight: 800;
  color: #172033;
  text-align: right;
}

textarea {
  width: 100%;
  min-height: 170px;

  border:
    1.5px solid #d6deea;

  border-radius: 18px;
  padding: 18px;

  font-size: 18px;
  line-height: 1.8;

  resize: vertical;
  outline: none;

  font-family: inherit;

  direction: rtl;
  text-align: right;

  background: #ffffff;
  color: #172033;
}

textarea::placeholder {
  color: #8a94a6;
}

textarea:focus {
  border-color: #2563eb;

  box-shadow:
    0 0 0 4px
    rgba(37, 99, 235, 0.08);
}


/* =========================
   QUESTION TOOLS
   ========================= */

.question-tools {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

.tool-button {
  margin: 0;
  min-height: 58px;
  padding: 13px 12px;

  border:
    1.5px solid #dbe5f5;

  border-radius: 16px;

  background: #f7f9ff;
  color: #174ea6;

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;
  font-family: inherit;

  -webkit-tap-highlight-color: transparent;
}

.tool-button:active {
  background: #eef3ff;
}


/* =========================
   IMAGE
   ========================= */

.image-box {
  margin-top: 20px;

  border:
    2px dashed #cbd5e1;

  border-radius: 20px;

  padding: 22px 18px;

  text-align: center;
  background: #fafcff;
}

.image-title {
  font-size: 19px;
  font-weight: 800;
  color: #172033;
  margin-bottom: 16px;
}

.file-label {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  min-height: 62px;

  border-radius: 16px;

  background: #eef4ff;
  color: #1856b8;

  font-size: 18px;
  font-weight: 800;

  cursor: pointer;

  padding: 12px 16px;

  -webkit-tap-highlight-color: transparent;
}

#imageInput {
  display: none;
}

.image-status {
  display: none;
  margin-top: 14px;

  color: #147a3e;

  font-size: 16px;
  font-weight: 700;
}

.preview-wrap {
  display: none;

  margin-top: 16px;
  padding: 10px;

  border:
    1px solid #e1e7f0;

  border-radius: 16px;

  background: #ffffff;
}

#preview {
  display: block;

  width: 100%;
  max-height: 420px;

  object-fit: contain;

  border-radius: 12px;
  background: #ffffff;
}

.image-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 12px;
}

.small-button {
  border:
    1px solid #dbe5f5;

  border-radius: 13px;

  min-height: 48px;

  font-family: inherit;
  font-size: 15px;
  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.change-image {
  background: #eef4ff;
  color: #1856b8;
}

.remove-image {
  background: #fff5f5;
  color: #b42318;
  border-color: #f5d0d0;
}


/* =========================
   SOLVE
   ========================= */

.solve-button {
  width: 100%;

  margin-top: 22px;

  min-height: 66px;

  border: 0;
  border-radius: 18px;

  padding: 16px 20px;

  background: #2563eb;
  color: #ffffff;

  font-family: inherit;

  font-size: 21px;
  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 7px 18px
    rgba(37, 99, 235, 0.16);

  -webkit-tap-highlight-color: transparent;
}

.solve-button:active {
  transform: scale(0.995);
}

.solve-button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}


/* =========================
   LOADING
   ========================= */

.loading {
  display: none;

  text-align: center;

  padding: 24px 10px 8px;

  color: #475569;

  font-size: 17px;
  font-weight: 700;
}


/* =========================
   ANSWER
   ========================= */

.answer-section {
  display: none;
  margin-top: 24px;
}

.answer-title {
  margin-bottom: 12px;

  color: #172033;

  font-size: 22px;
  font-weight: 800;

  text-align: right;
}

.answer {
  display: block;

  width: 100%;

  background: #f8faff;

  border:
    1px solid #dce6f7;

  border-radius: 20px;

  padding: 22px;

  font-size: 18px;
  line-height: 2;

  direction: rtl;
  text-align: right;

  color: #172033;

  overflow: hidden;

  overflow-wrap: break-word;
  word-break: normal;
}


/* =========================
   TEXT
   ========================= */

.text-line {
  display: block;

  width: 100%;

  direction: rtl;
  text-align: right;

  unicode-bidi: isolate;

  margin: 0 0 8px;
}

.empty-line {
  width: 100%;
  height: 10px;
}


/* =========================
   DISPLAY MATH
   ========================= */

.display-math {
  display: block;

  width: 100%;

  direction: ltr;

  unicode-bidi: isolate;

  text-align: center;

  margin: 15px 0;

  padding: 8px 2px;

  overflow-x: auto;
  overflow-y: hidden;

  -webkit-overflow-scrolling: touch;
}


/* =========================
   INLINE MATH
   ========================= */

.inline-math {
  display: inline-flex;

  direction: ltr;

  unicode-bidi: isolate;

  vertical-align: middle;

  margin: 0 4px;

  max-width: 100%;
}


/* =========================
   MATHJAX SVG
   ========================= */

.display-math mjx-container {
  display: block !important;

  direction: ltr !important;

  text-align: center !important;

  margin: 0 auto !important;

  max-width: 100% !important;
}

.inline-math mjx-container {
  display: inline-block !important;

  direction: ltr !important;

  margin: 0 !important;
}

.display-math svg {
  display: inline-block;

  max-width: none;

  height: auto;

  vertical-align: middle;
}

.inline-math svg {
  display: inline-block;

  max-width: 100%;

  height: auto;

  vertical-align: middle;
}


/* =========================
   FALLBACK
   ========================= */

.math-fallback {
  direction: ltr;

  unicode-bidi: isolate;

  font-family:
    "SFMono-Regular",
    Consolas,
    monospace;

  white-space: pre-wrap;

  overflow-wrap: anywhere;
}


/* =========================
   ANSWER ACTIONS
   ========================= */

.answer-actions {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 16px;
}

.answer-action {
  min-height: 56px;

  border:
    1.5px solid #cddbf2;

  border-radius: 15px;

  background: #ffffff;
  color: #174ea6;

  font-family: inherit;

  font-size: 16px;
  font-weight: 800;

  cursor: pointer;

  padding: 10px 8px;

  -webkit-tap-highlight-color: transparent;
}

.answer-action:active {
  background: #f0f5ff;
}


/* =========================
   FEEDBACK
   ========================= */

.feedback {
  margin-top: 22px;

  padding: 22px;

  border:
    1px solid #e0e6ef;

  border-radius: 20px;

  background: #fafbfc;
}

.feedback-title {
  margin-bottom: 17px;

  text-align: center;

  color: #172033;

  font-size: 21px;
  font-weight: 800;
}

.feedback-buttons {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;
}

.feedback-button {
  min-height: 58px;

  border: 0;

  border-radius: 15px;

  color: #ffffff;

  font-family: inherit;

  font-size: 18px;
  font-weight: 800;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.yes-button {
  background: #16803d;
}

.no-button {
  background: #c9363e;
}

.feedback-message {
  display: none;

  margin-top: 14px;

  text-align: center;

  color: #475569;

  font-size: 15px;
  font-weight: 700;
}


/* =========================
   ERROR
   ========================= */

.answer.error {
  background: #fff5f5;

  border-color: #f3c7ca;

  color: #991b1b;

  direction: rtl;

  text-align: right;

  white-space: pre-wrap;
}


/* =========================
   NOTE
   ========================= */

.note {
  margin-top: 22px;

  color: #667085;

  text-align: center;

  font-size: 14px;

  line-height: 1.7;

  font-weight: 500;
}


/* =========================
   TOAST
   ========================= */

.toast {
  position: fixed;

  left: 50%;
  bottom: 28px;

  transform:
    translateX(-50%)
    translateY(20px);

  background: #172033;

  color: #ffffff;

  padding: 12px 18px;

  border-radius: 13px;

  font-size: 15px;
  font-weight: 700;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease;

  z-index: 9999;

  text-align: center;

  max-width: calc(100% - 32px);
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

  .header {
    padding: 38px 16px 55px;
  }

  .logo {
    font-size: 38px;
  }

  .subtitle {
    font-size: 17px;
  }

  .container {
    padding: 0 12px;
  }

  .card {
    padding: 20px 16px;
  }

  h2 {
    font-size: 23px;
  }

  textarea {
    font-size: 17px;
  }

  .answer {
    padding: 19px 16px;

    font-size: 17px;

    line-height: 2;
  }

  .answer-actions {
    grid-template-columns: 1fr;
  }

  .answer-action {
    min-height: 55px;
    font-size: 17px;
  }

  .feedback {
    padding: 18px 14px;
  }

  .feedback-title {
    font-size: 20px;
  }

  .display-math {
    margin: 12px 0;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

  <div class="logo">
    ONE Study
  </div>

  <div class="subtitle">
    مساعدك الدراسي بالذكاء الاصطناعي
  </div>

</div>


<!-- =========================
     MAIN
     ========================= -->

<div class="container">

  <div class="card">


    <h2>
      ما السؤال الذي تريد حله؟
    </h2>


    <textarea
      id="question"
      placeholder="اكتب السؤال هنا أو الصقه..."
    ></textarea>


    <div class="question-tools">

      <button
        id="pasteButton"
        class="tool-button"
        type="button"
      >
        📋 لصق
      </button>

      <button
        id="clearButton"
        class="tool-button"
        type="button"
      >
        ✕ مسح السؤال
      </button>

    </div>


    <!-- =========================
         IMAGE
         ========================= -->

    <div class="image-box">

      <div class="image-title">
        🖼️ صورة السؤال
      </div>

      <label
        class="file-label"
        for="imageInput"
      >
        اختيار صورة من الاستديو
      </label>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >

      <div
        id="imageStatus"

      </div>

      <div

      >

        <img
          id="preview"
          alt="معاينة صورة السؤال"
        >

        <div class="image-actions">

          <button
            id="changeImageButton"
            class="small-button change-image"
            type="button"
          >
            تغيير الصورة
          </button>

          <button
            id="removeImageButton"
            class="small-button remove-image"
            type="button"
          >
            حذف الصورة
          </button>

        </div>

      </div>

    </div>


    <!-- =========================
         SOLVE
         ========================= -->

    <button
      id="askButton"
      class="solve-button"
      type="button"
    >
      حل السؤال
    </button>


    <div
      id="loading"
      class="loading"
    >
      جاري تحليل السؤال...
    </div>


    <!-- =========================
         ANSWER
         ========================= -->

    <div
      id="answerSection"
      class="answer-section"
    >

      <div class="answer-title">
        الحل
      </div>

      <div
        id="answer"
        class="answer"
      ></div>


      <div class="answer-actions">

        <button
          id="copyAnswerButton"
          class="answer-action"
          type="button"
        >
          📋 نسخ الإجابة
        </button>

        <button
          id="saveAnswerButton"
          class="answer-action"
          type="button"
        >
          💾 حفظ الإجابة
        </button>

        <button
          id="shareAnswerButton"
          class="answer-action"
          type="button"
        >
          📤 مشاركة
        </button>

      </div>


      <!-- FEEDBACK -->

      <div class="feedback">

        <div class="feedback-title">
          هل كانت الإجابة مفيدة؟
        </div>

        <div class="feedback-buttons">

          <button
            id="yesButton"
            class="feedback-button yes-button"
            type="button"
          >
            👍 نعم
          </button>

          <button
            id="noButton"
            class="feedback-button no-button"
            type="button"
          >
            👎 لا
          </button>

        </div>

        <div
          id="feedbackMessage"
          class="feedback-message"
        ></div>

      </div>

    </div>


    <div class="note">
      راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
    </div>


  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

(function () {

"use strict";


/* =========================
   SETTINGS
   ========================= */

var API_URL = "/ask";

var mathJaxPromise = null;

var currentAnswerText = "";

var toastTimer = null;


/* =========================
   ELEMENTS
   ========================= */

var questionInput =
  document.getElementById("question");

var imageInput =
  document.getElementById("imageInput");

var imageStatus =
  document.getElementById("imageStatus");

var previewWrap =
  document.getElementById("previewWrap");

var preview =
  document.getElementById("preview");

var pasteButton =
  document.getElementById("pasteButton");

var clearButton =
  document.getElementById("clearButton");

var changeImageButton =
  document.getElementById("changeImageButton");

var removeImageButton =
  document.getElementById("removeImageButton");

var askButton =
  document.getElementById("askButton");

var loading =
  document.getElementById("loading");

var answerSection =
  document.getElementById("answerSection");

var answer =
  document.getElementById("answer");

var copyAnswerButton =
  document.getElementById("copyAnswerButton");

var saveAnswerButton =
  document.getElementById("saveAnswerButton");

var shareAnswerButton =
  document.getElementById("shareAnswerButton");

var yesButton =
  document.getElementById("yesButton");

var noButton =
  document.getElementById("noButton");

var feedbackMessage =
  document.getElementById("feedbackMessage");

var toast =
  document.getElementById("toast");


/* =========================
   TOAST
   ========================= */

function showToast(message) {

  toast.textContent = message;

  toast.classList.add("show");

  if (toastTimer) {
    clearTimeout(toastTimer);
  }

  toastTimer =
    setTimeout(
      function () {
        toast.classList.remove("show");
      },
      2200
    );

}


/* =========================
   MATHJAX SVG CONFIG
   ========================= */

function configureMathJax() {

  window.MathJax = {

    tex: {
      processEscapes: true
    },

    svg: {
      fontCache: "local",
      displayAlign: "center"
    },

    startup: {
      typeset: false
    }

  };

}


/* =========================
   LOAD SCRIPT
   ========================= */

function loadScript(url) {

  return new Promise(

    function (resolve, reject) {

      var script =
        document.createElement("script");

      script.src = url;

      script.async = true;

      script.onload =
        function () {
          resolve();
        };

      script.onerror =
        function () {

          script.remove();

          reject(
            new Error(
              "فشل تحميل مكتبة الرياضيات."
            )
          );

        };

      document.head.appendChild(script);

    }

  );

}


/* =========================
   LOAD MATHJAX SVG
   ========================= */

async function loadMathJax() {

  if (
    window.MathJax &&
    typeof window.MathJax.tex2svgPromise ===
      "function"
  ) {

    return true;

  }

  if (mathJaxPromise) {
    return mathJaxPromise;
  }

  mathJaxPromise =
    (async function () {

      var sources = [

        "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js",

        "https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js",

        "https://unpkg.com/mathjax@3.2.2/es5/tex-svg.js"

      ];

      for (
        var i = 0;
        i < sources.length;
        i++
      ) {

        try {

          configureMathJax();

          await loadScript(
            sources[i]
          );

          if (
            window.MathJax &&
            window.MathJax.startup &&
            window.MathJax.startup.promise
          ) {

            await window.MathJax
              .startup
              .promise;

          }

          if (
            window.MathJax &&
            typeof window.MathJax.tex2svgPromise ===
              "function"
          ) {

            console.log(
              "MathJax SVG ready:",
              sources[i]
            );

            return true;

          }

        } catch (error) {

          console.warn(
            "MathJax source failed:",
            sources[i],
            error
          );

        }

      }

      mathJaxPromise = null;

      return false;

    })();

  return mathJaxPromise;

}


/* =========================
   IMAGE TO BASE64
   ========================= */

async function fileToDataURL(file) {

  var buffer =
    await file.arrayBuffer();

  var bytes =
    new Uint8Array(buffer);

  var binary = "";

  var chunkSize =
    0x8000;

  for (
    var i = 0;
    i < bytes.length;
    i += chunkSize
  ) {

    var chunk =
      bytes.subarray(
        i,
        Math.min(
          i + chunkSize,
          bytes.length
        )
      );

    binary +=
      String.fromCharCode.apply(
        null,
        chunk
      );

  }

  var base64 =
    btoa(binary);

  var mimeType =
    file.type ||
    "image/jpeg";

  return (
    "data:" +
    mimeType +
    ";base64," +
    base64
  );

}


/* =========================
   IMAGE
   ========================= */

function clearImage() {

  imageInput.value = "";

  imageStatus.style.display =
    "none";

  previewWrap.style.display =
    "none";

  preview.removeAttribute("src");

}


imageInput.addEventListener(

  "change",

  function () {

    var file =
      imageInput.files &&
      imageInput.files.length > 0
        ? imageInput.files[0]
        : null;

    if (!file) {

      clearImage();

      return;

    }

    if (
      file.type &&
      file.type.indexOf("image/") !== 0
    ) {

      clearImage();

      alert(
        "الملف المختار ليس صورة."
      );

      return;

    }

    var maxSize =
      10 * 1024 * 1024;

    if (file.size > maxSize) {

      clearImage();

      alert(
        "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
      );

      return;

    }

    imageStatus.style.display =
      "block";

    if (
      window.URL &&
      window.URL.createObjectURL
    ) {

      var imageURL =
        window.URL.createObjectURL(
          file
        );

      preview.onload =
        function () {

          if (
            window.URL &&
            window.URL.revokeObjectURL
          ) {

            window.URL.revokeObjectURL(
              imageURL
            );

          }

        };

      preview.src =
        imageURL;

      previewWrap.style.display =
        "block";

    }

  }

);


changeImageButton.addEventListener(

  "click",

  function () {
    imageInput.click();
  }

);


removeImageButton.addEventListener(

  "click",

  function () {

    clearImage();

    showToast(
      "تم حذف الصورة"
    );

  }

);


/* =========================
   PASTE
   ========================= */

pasteButton.addEventListener(

  "click",

  async function () {

    try {

      if (
        navigator.clipboard &&
        navigator.clipboard.readText
      ) {

        var text =
          await navigator.clipboard
            .readText();

        if (!text) {

          showToast(
            "لا يوجد نص للصق"
          );

          return;

        }

        questionInput.value =
          text;

        questionInput.focus();

        showToast(
          "تم لصق النص"
        );

      } else {

        questionInput.focus();

        showToast(
          "اضغط مطولاً داخل مربع السؤال ثم اختر لصق"
        );

      }

    } catch (error) {

      questionInput.focus();

      showToast(
        "اضغط مطولاً داخل مربع السؤال ثم اختر لصق"
      );

  }

);

clearButton.addEventListener(

/* =========================
   SCROLL
   ========================= */

function scrollToAnswer() {

    answerSection.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });

  } catch (error) {

/* =========================
   ERROR
   ========================= */

function showError(message) {

  currentAnswerText = "";

  answer.innerHTML = "";

  answer.classList.add("error");

}


/* =========================
   NORMALIZE RESPONSE
   ========================= */

function normalizeResponse(text) {

  var source =
    String(text || "");

  source =
    source
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n");


  /*
   * Internal math markers
   */

  source =
    source.replace(
      /\$?begin:math:display\$?/gi,
      "\\["
    );

  source =
    source.replace(
      /\$?end:math:display\$?/gi,
      "\\]"
    );

  source =
    source.replace(
      /\$?begin:math:inline\$?/gi,
      "\\("
    );

  source =
    source.replace(
      /\$?end:math:inline\$?/gi,
      "\\)"
    );

  source =
    source.replace(
      /\$?begin:math:text\$?/gi,
      "\\("
    );

  source =
    source.replace(
      /\$?end:math:text\$?/gi,
      "\\)"
    );


  /*
   * $$ ... $$
   */

  source =
    source.replace(

      /\$\$([\s\S]*?)\$\$/g,

      function (_, math) {

        return (
          "\\[" +
          math.trim() +
          "\\]"
        );

      }

    );


  /*
   * $ ... $
   */

  source =
    source.replace(

      /(^|[^\\$])\$([^$\n]+?)\$/g,

      function (_, prefix, math) {

        return (
          prefix +
          "\\(" +
          math.trim() +
          "\\)"
        );

      }

    );


  /*
   * Clean delimiters
   */

  source =
    source.replace(
      /\\\[\s+/g,
      "\\["
    );

  source =
    source.replace(
      /\s+\\\]/g,
      "\\]"
    );

  source =
    source.replace(
      /\\\(\s+/g,
      "\\("
    );

  source =
    source.replace(
      /\s+\\\)/g,
      "\\)"
    );


  /*
   * Double escaped delimiters
   */

  source =
    source.replace(
      /\\\\\[/g,
      "\\["
    );

  source =
    source.replace(
      /\\\\\]/g,
      "\\]"
    );

  source =
    source.replace(
      /\\\\\(/g,
      "\\("
    );

  source =
    source.replace(
      /\\\\\)/g,
      "\\)"
    );


  return source;

}


/* =========================
   LATEX DETECTION
   ========================= */

function looksLikeLatex(text) {

  var value =
    String(text || "").trim();

  if (!value) {
    return false;
  }

  if (
    /\\(?:frac|dfrac|tfrac|sqrt|pm|mp|times|cdot|div|leq|geq|neq|approx|equiv|infty|sum|prod|int|lim|sin|cos|tan|log|ln|theta|alpha|beta|gamma|delta|pi|left|right|begin|end|text|mathrm|mathbf|overline|underline|vec|hat|bar|Rightarrow|Leftarrow|rightarrow|leftarrow|quad)\b/.test(
      value
    )
  ) {
    return true;
  }

  if (
    /[A-Za-z0-9]\s*[=<>]\s*[A-Za-z0-9\\{(\[]/.test(
      value
    )
  ) {
    return true;
  }

  if (
    /[A-Za-z]\s*\^\s*\{?[0-9A-Za-z+\-]+/.test(
      value
    )
  ) {
    return true;
  }

  if (
    /[A-Za-z]\s*_\s*\{?[0-9A-Za-z+\-]+/.test(
      value
    )
  ) {
    return true;
  }

  return false;

}


/* =========================
   CREATE DISPLAY MATH

   IMPORTANT:
   We store RAW TeX only.
   No \[ \] are inserted into DOM.
   ========================= */

function createDisplayMath(math) {

  var div =
    document.createElement("div");

  div.className =
    "display-math";

  div.setAttribute(
    "dir",
    "ltr"
  );

  div.dataset.tex =
    String(math || "").trim();

  div.dataset.display =
    "true";

  return div;

}


/* =========================
   CREATE INLINE MATH
   ========================= */

function createInlineMath(math) {

  var span =
    document.createElement("span");

  span.className =
    "inline-math";

  span.setAttribute(
    "dir",
    "ltr"
  );

  span.dataset.tex =
    String(math || "").trim();

  span.dataset.display =
    "false";

  return span;

}


/* =========================
   INLINE CONTENT
   ========================= */

function appendInlineContent(
  parent,
  line
) {

  var inlineRegex =
    /\\\(([\s\S]*?)\\\)/g;

  var lastIndex = 0;

  var match;

  while (
    (
      match =
        inlineRegex.exec(line)
    ) !== null
  ) {

    var before =
      line.slice(
        lastIndex,
        match.index
      );

    if (before) {

      parent.appendChild(
        document.createTextNode(
          before
        )
      );

    }

    parent.appendChild(
      createInlineMath(
        match[1]
      )
    );

    lastIndex =
      inlineRegex.lastIndex;

  }

  var remaining =
    line.slice(lastIndex);

  if (remaining) {

    parent.appendChild(
      document.createTextNode(
        remaining
      )
    );

  }

}


/* =========================
   TEXT LINE
   ========================= */

function appendTextLine(line) {

  var cleanLine =
    String(line || "").trim();

  if (!cleanLine) {

    var empty =
      document.createElement("div");

    empty.className =
      "empty-line";

    answer.appendChild(empty);

    return;

  }


  var containsArabic =
    /[\u0600-\u06FF]/.test(
      cleanLine
    );


  /*
   * Pure mathematical line
   */

  if (
    !containsArabic &&
    looksLikeLatex(cleanLine)
  ) {

    answer.appendChild(
      createDisplayMath(
        cleanLine
      )
    );

    return;

  }


  /*
   * Normal Arabic/text line
   */

  var div =
    document.createElement("div");

  div.className =
    "text-line";

  div.setAttribute(
    "dir",
    "rtl"
  );

  appendInlineContent(
    div,
    cleanLine
  );

  answer.appendChild(div);

}


/* =========================
   TEXT BLOCK
   ========================= */

function appendTextBlock(text) {

  if (
    text === null ||
    text === undefined
  ) {
    return;
  }

  var lines =
    String(text).split("\n");

  lines.forEach(

    function (line) {

      appendTextLine(line);

    }

  );

}


/* =========================
   PARSE ANSWER
   ========================= */

function parseAnswer(text) {

  answer.innerHTML = "";

  var source =
    normalizeResponse(text);

  var displayRegex =
    /\\\[([\s\S]*?)\\\]/g;

  var lastIndex = 0;

  var match;

  while (
    (
      match =
        displayRegex.exec(source)
    ) !== null
  ) {

    var before =
      source.slice(
        lastIndex,
        match.index
      );

    appendTextBlock(before);

    var math =
      match[1];

    if (
      math &&
      math.trim()
    ) {

      answer.appendChild(
        createDisplayMath(math)
      );

    }

    lastIndex =
      displayRegex.lastIndex;

  }

  appendTextBlock(
    source.slice(lastIndex)
  );

}


/* =========================
   FALLBACK
   ========================= */

function applyMathFallback() {

  var mathBlocks =
    answer.querySelectorAll(
      ".display-math[data-tex], .inline-math[data-tex]"
    );

  mathBlocks.forEach(

    function (element) {

      element.classList.add(
        "math-fallback"
      );

      element.textContent =
        element.dataset.tex || "";

    }

  );

}


/* =========================
   FIT DISPLAY EQUATION

   Long equations remain inside
   the phone screen.
   ========================= */

function fitDisplayEquation(element) {

  var svg =
    element.querySelector("svg");

  if (!svg) {
    return;
  }

  /*
   * Do not force the equation
   * wider than its container.
   */

  svg.style.height = "auto";

  svg.style.verticalAlign =
    "middle";

  /*
   * MathJax SVG normally uses
   * em dimensions. We allow the
   * wrapper to scroll if an
   * equation is genuinely long.
   */

  element.style.overflowX =
    "auto";

  element.style.overflowY =
    "hidden";

}


/* =========================
   RENDER MATH DIRECTLY TO SVG
   ========================= */

async function renderMath() {

  var loaded =
    await loadMathJax();

  if (
    !loaded ||
    !window.MathJax ||
    typeof window.MathJax.tex2svgPromise !==
      "function"
  ) {

    console.error(
      "MathJax SVG engine unavailable."
    );

    applyMathFallback();

    return;

  }


  var mathElements =
    answer.querySelectorAll(
      ".display-math[data-tex], .inline-math[data-tex]"
    );


  for (
    var i = 0;
    i < mathElements.length;
    i++
  ) {

    var element =
      mathElements[i];

    var tex =
      element.dataset.tex || "";

    var isDisplay =
      element.dataset.display ===
      "true";


    if (!tex.trim()) {
      continue;
    }


    try {

      /*
       * Direct TeX -> SVG conversion.
       *
       * This avoids delimiter scanning
       * and RTL/LTR conflicts.
       */

      var rendered =
        await window.MathJax
          .tex2svgPromise(

            tex,

            {
              display:
                isDisplay
            }

          );


      element.innerHTML = "";

      element.appendChild(
        rendered
      );


      if (isDisplay) {

        fitDisplayEquation(
          element
        );

      } else {

        var inlineSVG =
          element.querySelector("svg");

        if (inlineSVG) {

          inlineSVG.style.height =
            "auto";

          inlineSVG.style.verticalAlign =
            "middle";

        }

      }


    } catch (error) {

      console.error(
        "Math rendering failed:",
        tex,
        error
      );

      element.classList.add(
        "math-fallback"
      );

      element.textContent =
        tex;

    }

  }

}


/* =========================
   SHOW ANSWER
   ========================= */

async function showAnswer(text) {

  currentAnswerText =
    String(text || "");

  answer.classList.remove(
    "error"
  );

  parseAnswer(
    currentAnswerText
  );

  answerSection.style.display =
    "block";

  feedbackMessage.style.display =
    "none";

  loading.style.display =
    "block";

  loading.textContent =
    "جاري تنسيق المعادلات...";

  await renderMath();

  loading.style.display =
    "none";

  scrollToAnswer();

}


/* =========================
   ASK AI
   ========================= */

async function askAI() {

  var question =
    questionInput.value.trim();

  var file =
    imageInput.files &&
    imageInput.files.length > 0
      ? imageInput.files[0]
      : null;


  if (
    !question &&
    !file
  ) {

    alert(
      "اكتب سؤالاً أو اختر صورة أولاً."
    );

    return;

  }


  askButton.disabled = true;

  answerSection.style.display =
    "none";

  answer.innerHTML = "";

  answer.classList.remove(
    "error"
  );

  loading.style.display =
    "block";

  loading.textContent =
    "جاري تحليل السؤال...";


  try {

    var imageData = null;


    if (file) {

      loading.textContent =
        "جاري تجهيز الصورة...";

      imageData =
        await fileToDataURL(
          file
        );

    }


    loading.textContent =
      file
        ? "جاري تحليل السؤال والصورة..."
        : "جاري تحليل السؤال...";


    var response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              question:
                question,

              image:
                imageData

            })

        }

      );


    var responseText =
      await response.text();

    var data;


    try {

      data =
        JSON.parse(
          responseText
        );

    } catch (error) {

      throw new Error(
        "الخادم أعاد استجابة غير صالحة."
      );

    }


    if (!response.ok) {

      throw new Error(

        data.error ||
        "حدث خطأ أثناء معالجة السؤال."

      );

    }


    var finalAnswer =

      data.answer ||

      data.output ||

      data.response;


    if (!finalAnswer) {

      throw new Error(
        "تم الاتصال بالخادم ولكن لم تصل إجابة."
      );

    }


    await showAnswer(
      finalAnswer
    );


  } catch (error) {

    console.error(
      "ONE STUDY ERROR:",
      error
    );


    showError(

      error &&
      error.message

        ? error.message

        : "حدث خطأ غير معروف."

    );


  } finally {

    loading.style.display =
      "none";

    loading.textContent =
      "جاري تحليل السؤال...";

    askButton.disabled =
      false;

  }

}


/* =========================
   COPY ANSWER
   ========================= */

async function copyAnswer() {

  if (!currentAnswerText) {

    showToast(
      "لا توجد إجابة لنسخها"
    );

    return;

  }


  try {

    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      await navigator.clipboard
        .writeText(
          currentAnswerText
        );

      showToast(
        "تم نسخ الإجابة"
      );

      return;

    }


    throw new Error(
      "Clipboard unavailable"
    );


  } catch (error) {

    var textArea =
      document.createElement(
        "textarea"
      );

    textArea.value =
      currentAnswerText;

    textArea.style.position =
      "fixed";

    textArea.style.opacity =
      "0";

    document.body.appendChild(
      textArea
    );

    textArea.select();


    try {

      document.execCommand(
        "copy"
      );

      showToast(
        "تم نسخ الإجابة"
      );

    } catch (copyError) {

      showToast(
        "تعذر نسخ الإجابة"
      );

    }


    textArea.remove();

  }

}


/* =========================
   SAVE ANSWER
   ========================= */

function saveAnswer() {

  if (!currentAnswerText) {

    showToast(
      "لا توجد إجابة لحفظها"
    );

    return;

  }


  try {

    var content =
      "ONE Study\n\n" +
      currentAnswerText;


    var blob =
      new Blob(

        [content],

        {
          type:
            "text/plain;charset=utf-8"
        }

      );


    var url =
      URL.createObjectURL(
        blob
      );


    var link =
      document.createElement(
        "a"
      );


    link.href =
      url;

    link.download =
      "ONE-Study-answer.txt";


    document.body.appendChild(
      link
    );

    link.click();

    link.remove();


    setTimeout(

      function () {

        URL.revokeObjectURL(
          url
        );

      },

      1000

    );


    showToast(
      "تم تجهيز الإجابة للحفظ"
    );


  } catch (error) {

    console.error(
      "Save error:",
      error
    );

    showToast(
      "تعذر حفظ الإجابة"
    );

  }

}


/* =========================
   SHARE ANSWER
   ========================= */

async function shareAnswer() {

  if (!currentAnswerText) {

    showToast(
      "لا توجد إجابة لمشاركتها"
    );

    return;

  }


  try {

    if (navigator.share) {

      await navigator.share({

        title:
          "ONE Study",

        text:
          currentAnswerText

      });

    } else {

      await copyAnswer();

      showToast(
        "تم نسخ الإجابة للمشاركة"
      );

    }


  } catch (error) {

    if (
      error &&
      error.name ===
      "AbortError"
    ) {
      return;
    }


    console.error(
      "Share error:",
      error
    );


    showToast(
      "تعذر فتح المشاركة"
    );

  }

}


/* =========================
   FEEDBACK
   ========================= */

function setFeedback(value) {

  feedbackMessage.style.display =
    "block";

  yesButton.disabled =
    true;

  noButton.disabled =
    true;


  if (value === "yes") {

    feedbackMessage.textContent =
      "شكرًا لتقييمك 👍";

  } else {

    feedbackMessage.textContent =
      "شكرًا لتقييمك. سنعمل على تحسين الإجابات.";

  }


  setTimeout(

    function () {

      yesButton.disabled =
        false;

      noButton.disabled =
        false;

    },

    700

  );

}


/* =========================
   EVENTS
   ========================= */

askButton.addEventListener(

  "click",

  function () {
    askAI();
  }

);


copyAnswerButton.addEventListener(

  "click",

  function () {
    copyAnswer();
  }

);


saveAnswerButton.addEventListener(

  "click",

  function () {
    saveAnswer();
  }

);


shareAnswerButton.addEventListener(

  "click",

  function () {
    shareAnswer();
  }

);


yesButton.addEventListener(

  "click",

  function () {

    setFeedback(
      "yes"
    );

  }

);


noButton.addEventListener(

  "click",

  function () {

    setFeedback(
      "no"
    );

  }

);


/* =========================
   PRELOAD MATH ENGINE
   ========================= */

loadMathJax()

  .then(

    function (loaded) {

      console.log(
        "Math SVG engine ready:",
        loaded
      );

    }

  )

  .catch(

    function (error) {

      console.warn(
        "Math preload error:",
        error
      );

    }

  );


})();

</script>
