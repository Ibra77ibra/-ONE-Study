<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ONE Study</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;
      padding: 42px 20px 58px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: -32px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 23px;
      text-align: right;
    }

    textarea {
      width: 100%;
      min-height: 155px;

      border:
        1px solid #dbe2ea;

      border-radius: 16px;
      padding: 16px;

      font-size: 17px;
      resize: vertical;
      outline: none;

      font-family: inherit;

      direction: rtl;
      text-align: right;
    }

    textarea:focus {
      border-color: #2563eb;
    }


    /* =========================
       IMAGE AREA
       ========================= */

    .image-box {
      margin-top: 17px;

      border:
        2px dashed #cbd5e1;

      border-radius: 16px;

      padding: 20px;

      text-align: center;

      background: #f8fafc;
    }

    .image-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    input[type="file"] {
      width: 100%;
      font-size: 15px;
    }

    #preview {
      display: none;

      width: 100%;
      max-height: 350px;

      object-fit: contain;

      border-radius: 14px;

      margin-top: 18px;

      background: white;
    }

    .image-status {
      display: none;

      margin-top: 12px;

      color: #15803d;

      font-weight: 700;
      font-size: 15px;
    }


    /* =========================
       BUTTON
       ========================= */

    button {
      width: 100%;

      margin-top: 20px;

      border: 0;
      border-radius: 16px;

      padding: 17px;

      font-size: 20px;
      font-weight: 700;

      background: #2563eb;
      color: white;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* =========================
       LOADING
       ========================= */

    .loading {
      display: none;

      text-align: center;

      padding: 22px 10px;

      color: #475569;

      font-size: 17px;
      font-weight: 600;
    }


    /* =========================
       ANSWER
       ========================= */

    .answer {
      display: none;

      margin-top: 20px;

      background: #eef4ff;

      border:
        1px solid #dbeafe;

      border-radius: 16px;

      padding: 20px;

      font-size: 17px;

      line-height: 2;

      direction: rtl;
      text-align: right;

      overflow-wrap: break-word;
      word-break: normal;
    }


    /*
     * سطر عربي
     */
    .answer-line {
      width: 100%;

      direction: rtl;
      text-align: right;

      unicode-bidi: plaintext;

      margin:
        4px 0;
    }


    /*
     * سطر رياضي مستقل
     */
    .math-line {
      width: 100%;

      direction: ltr;
      text-align: left;

      unicode-bidi: isolate;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

      font-size: 17px;
      font-weight: 600;

      line-height: 1.9;

      margin:
        8px 0;

      padding:
        2px 0;

      overflow-wrap: break-word;
    }


    /*
     * معادلة داخل سطر عربي
     */
    .inline-math {
      display: inline-block;

      direction: ltr;

      unicode-bidi: isolate;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

      font-weight: 600;

      margin:
        0 3px;
    }


    /*
     * سطر فارغ
     */
    .answer-space {
      height: 12px;
    }


    /*
     * رسالة الخطأ
     */
    .answer.error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;

      direction: rtl;
      text-align: right;

      white-space: pre-wrap;
    }


    .note {
      font-size: 14px;

      color: #64748b;

      margin-top: 14px;

      text-align: center;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .header {
        padding:
          38px 16px 55px;
      }

      .logo {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }

      h2 {
        font-size: 22px;
      }

      .answer {
        padding: 18px 16px;
        font-size: 17px;
      }

      .math-line {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <div class="logo">
      ONE Study
    </div>

    <div class="subtitle">
      مساعدك الدراسي بالذكاء الاصطناعي
    </div>

  </div>


  <!-- =========================
       MAIN
       ========================= -->

  <div class="container">

    <div class="card">


      <h2>
        ما السؤال الذي تريد حله؟
      </h2>


      <textarea
        id="question"
        placeholder="اكتب السؤال هنا..."
      ></textarea>


      <!-- IMAGE -->

      <div class="image-box">

        <div class="image-title">
          📷 صوّر أو اختر صورة للسؤال
        </div>


        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
        >


        <div
          id="imageStatus"
          class="image-status"
        >
          ✓ تم اختيار الصورة
        </div>


        <img
          id="preview"
          alt="معاينة صورة السؤال"
        >

      </div>


      <!-- BUTTON -->

      <button
        id="askButton"
        type="button"
      >
        حل السؤال
      </button>


      <!-- LOADING -->

      <div
        id="loading"
        class="loading"
      >
        جاري تحليل السؤال...
      </div>


      <!-- ANSWER -->

      <div
        id="answer"
        class="answer"
      ></div>


      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>


    </div>

  </div>



<script>

(function () {

  "use strict";


  /* =========================
     SETTINGS
     ========================= */

  var API_URL = "/ask";


  /* =========================
     ELEMENTS
     ========================= */

  var questionInput =
    document.getElementById(
      "question"
    );


  var imageInput =
    document.getElementById(
      "imageInput"
    );


  var preview =
    document.getElementById(
      "preview"
    );


  var imageStatus =
    document.getElementById(
      "imageStatus"
    );


  var askButton =
    document.getElementById(
      "askButton"
    );


  var loading =
    document.getElementById(
      "loading"
    );


  var answer =
    document.getElementById(
      "answer"
    );



  /* =========================
     IMAGE TO BASE64
     بدون FileReader
     ========================= */

  async function fileToDataURL(file) {

    var buffer =
      await file.arrayBuffer();


    var bytes =
      new Uint8Array(
        buffer
      );


    var binary = "";


    var chunkSize =
      0x8000;


    for (
      var i = 0;
      i < bytes.length;
      i += chunkSize
    ) {

      var chunk =
        bytes.subarray(
          i,
          Math.min(
            i + chunkSize,
            bytes.length
          )
        );


      binary +=
        String.fromCharCode.apply(
          null,
          chunk
        );

    }


    var base64 =
      btoa(
        binary
      );


    var mimeType =
      file.type ||
      "image/jpeg";


    return (
      "data:" +
      mimeType +
      ";base64," +
      base64
    );

  }



  /* =========================
     IMAGE SELECTION
     ========================= */

  imageInput.addEventListener(
    "change",
    function () {


      var file =
        imageInput.files &&
        imageInput.files.length > 0

          ? imageInput.files[0]

          : null;


      imageStatus.style.display =
        "none";


      preview.style.display =
        "none";


      preview.removeAttribute(
        "src"
      );


      if (!file) {
        return;
      }



      /* CHECK FILE TYPE */

      if (
        file.type &&
        file.type.indexOf(
          "image/"
        ) !== 0
      ) {

        imageInput.value =
          "";


        alert(
          "الملف المختار ليس صورة."
        );


        return;

      }



      /* MAX 10 MB */

      var maxSize =
        10 *
        1024 *
        1024;


      if (
        file.size >
        maxSize
      ) {

        imageInput.value =
          "";


        alert(
          "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
        );


        return;

      }



      imageStatus.style.display =
        "block";



      /* IMAGE PREVIEW */

      if (
        window.URL &&
        window.URL.createObjectURL
      ) {

        var imageURL =
          window.URL.createObjectURL(
            file
          );


        preview.onload =
          function () {

            if (
              window.URL &&
              window.URL.revokeObjectURL
            ) {

              window.URL.revokeObjectURL(
                imageURL
              );

            }

          };


        preview.src =
          imageURL;


        preview.style.display =
          "block";

      }

    }
  );



  /* =========================
     ERROR
     ========================= */

  function showError(message) {


    answer.innerHTML =
      "";


    answer.classList.add(
      "error"
    );


    answer.textContent =
      "تعذر الحصول على الإجابة:\n" +
      message;


    answer.style.display =
      "block";


    scrollToAnswer();

  }



  /* =========================
     SCROLL
     ========================= */

  function scrollToAnswer() {

    try {

      answer.scrollIntoView({

        behavior:
          "smooth",

        block:
          "start"

      });

    }

    catch (e) {

      answer.scrollIntoView();

    }

  }



  /* =========================
     ARABIC DETECTION
     ========================= */

  function containsArabic(text) {

    return (
      /[\u0600-\u06FF]/.test(
        text
      )
    );

  }



  /* =========================
     MATH DETECTION
     ========================= */

  function looksLikeMath(text) {

    var value =
      String(text)
        .trim();


    if (!value) {
      return false;
    }


    /*
     * إذا كان السطر يحتوي
     * على كمية كبيرة من العربية
     * نعتبره شرحاً وليس معادلة مستقلة
     */

    var arabicMatches =
      value.match(
        /[\u0600-\u06FF]/g
      );


    var arabicCount =
      arabicMatches
        ? arabicMatches.length
        : 0;


    /*
     * علامات رياضية
     */

    var hasMathSymbol =
      /[=+\-−×÷√^<>≤≥±∫∑π∞]/.test(
        value
      );


    /*
     * متغيرات ودوال
     */

    var hasVariable =
      /\b[a-zA-Z]\b/.test(
        value
      ) ||
      /[a-zA-Z]\s*\(/.test(
        value
      );


    /*
     * أرقام
     */

    var hasNumber =
      /\d/.test(
        value
      );


    /*
     * معادلة غالباً
     */

    if (
      hasMathSymbol &&
      (
        hasVariable ||
        hasNumber
      ) &&
      arabicCount < 4
    ) {

      return true;

    }


    return false;

  }



  /* =========================
     NORMALIZE MATH
     ========================= */

  function normalizeMath(text) {

    var value =
      String(text);


    /*
     * توحيد بعض الرموز
     */

    value =
      value.replace(
        /\u2212/g,
        "-"
      );


    value =
      value.replace(
        /\s*=\s*/g,
        " = "
      );


    value =
      value.replace(
        /\s*\+\s*/g,
        " + "
      );


    value =
      value.replace(
        /\s*-\s*/g,
        " - "
      );


    value =
      value.replace(
        /\s{2,}/g,
        " "
      );


    return value.trim();

  }



  /* =========================
     CREATE ARABIC LINE
     ========================= */

  function createTextLine(text) {

    var div =
      document.createElement(
        "div"
      );


    div.className =
      "answer-line";


    div.setAttribute(
      "dir",
      "rtl"
    );


    div.textContent =
      text;


    return div;

  }



  /* =========================
     CREATE MATH LINE
     ========================= */

  function createMathLine(text) {

    var div =
      document.createElement(
        "div"
      );


    div.className =
      "math-line";


    div.setAttribute(
      "dir",
      "ltr"
    );


    div.textContent =
      normalizeMath(
        text
      );


    return div;

  }



  /* =========================
     CREATE EMPTY SPACE
     ========================= */

  function createSpace() {

    var div =
      document.createElement(
        "div"
      );


    div.className =
      "answer-space";


    return div;

  }



  /* =========================
     DISPLAY ANSWER
     ========================= */

  function showAnswer(text) {


    answer.classList.remove(
      "error"
    );


    answer.innerHTML =
      "";


    var cleanText =
      String(
        text || ""
      )
      .replace(
        /\r\n/g,
        "\n"
      )
      .replace(
        /\r/g,
        "\n"
      );


    var lines =
      cleanText.split(
        "\n"
      );


    lines.forEach(
      function (line) {


        var trimmed =
          line.trim();


        /*
         * EMPTY LINE
         */

        if (!trimmed) {

          answer.appendChild(
            createSpace()
          );

          return;

        }


        /*
         * PURE / MOSTLY MATH LINE
         */

        if (
          looksLikeMath(
            trimmed
          )
        ) {

          answer.appendChild(
            createMathLine(
              trimmed
            )
          );

          return;

        }


        /*
         * ARABIC / NORMAL TEXT
         */

        answer.appendChild(
          createTextLine(
            trimmed
          )
        );

      }
    );


    answer.style.display =
      "block";


    scrollToAnswer();

  }



  /* =========================
     ASK AI
     ========================= */

  async function askAI() {


    var question =
      questionInput.value
        .trim();


    var file =
      imageInput.files &&
      imageInput.files.length > 0

        ? imageInput.files[0]

        : null;



    /*
     * NOTHING ENTERED
     */

    if (
      !question &&
      !file
    ) {

      alert(
        "اكتب سؤالاً أو اختر صورة أولاً."
      );


      return;

    }



    /* LOCK BUTTON */

    askButton.disabled =
      true;


    answer.style.display =
      "none";


    answer.innerHTML =
      "";


    answer.classList.remove(
      "error"
    );


    loading.style.display =
      "block";


    loading.textContent =
      "جاري تحليل السؤال...";



    try {


      var imageData =
        null;



      /* IMAGE */

      if (file) {


        loading.textContent =
          "جاري تجهيز الصورة...";


        imageData =
          await fileToDataURL(
            file
          );

      }



      loading.textContent =
        file

          ? "جاري تحليل السؤال والصورة..."

          : "جاري تحليل السؤال...";



      /* REQUEST */

      var response =
        await fetch(

          API_URL,

          {

            method:
              "POST",


            headers: {

              "Content-Type":
                "application/json"

            },


            body:
              JSON.stringify({

                question:
                  question,

                image:
                  imageData

              })

          }

        );



      /* READ SERVER RESPONSE */

      var responseText =
        await response.text();



      var data;



      try {

        data =
          JSON.parse(
            responseText
          );

      }

      catch (e) {

        throw new Error(
          "الخادم أعاد استجابة غير صالحة."
        );

      }



      /* SERVER ERROR */

      if (
        !response.ok
      ) {

        throw new Error(

          data.error ||

          "حدث خطأ أثناء معالجة السؤال."

        );

      }



      /* GET ANSWER */

      var finalAnswer =

        data.answer ||

        data.output ||

        data.response;



      if (
        !finalAnswer
      ) {

        throw new Error(
          "تم الاتصال بالخادم ولكن لم تصل إجابة."
        );

      }



      /* SHOW ANSWER */

      showAnswer(
        finalAnswer
      );


    }

    catch (error) {


      console.error(
        "ONE STUDY ERROR:",
        error
      );


      showError(

        error &&
        error.message

          ? error.message

          : "حدث خطأ غير معروف."

      );


    }

    finally {


      loading.style.display =
        "none";


      loading.textContent =
        "جاري تحليل السؤال...";


      askButton.disabled =
        false;

    }

  }



  /* =========================
     BUTTON EVENT
     ========================= */

  askButton.addEventListener(

    "click",

    function () {

      askAI();

    }

  );


})();

</script>


</body>

</html>
