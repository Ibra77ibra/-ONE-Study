<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f9ff"
  >

  <title>ONE Study</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f7fbff 0%,
          #ffffff 42%,
          #f8fbff 100%
        );

      color: #172033;
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }


    /* ======================================================
       APP
       ====================================================== */

    .app {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      padding:
        22px
        16px
        50px;
    }


    /* ======================================================
       HEADER
       ====================================================== */

    .header {
      text-align: center;

      padding:
        14px
        8px
        24px;
    }

    .logo {
      width: 62px;
      height: 62px;

      margin: 0 auto 12px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;
      font-weight: 800;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #2675ff,
          #5c9cff
        );

      box-shadow:
        0 12px 30px
        rgba(38, 117, 255, 0.20);
    }

    .title {
      margin: 0;

      font-size: 27px;
      font-weight: 800;

      color: #111827;

      letter-spacing: -0.4px;
    }

    .subtitle {
      margin:
        8px
        auto
        0;

      max-width: 520px;

      color: #697386;

      font-size: 14px;
      line-height: 1.8;
    }


    /* ======================================================
       CARD
       ====================================================== */

    .card {
      background: rgba(255, 255, 255, 0.96);

      border:
        1px solid
        #e4ebf5;

      border-radius: 24px;

      padding: 18px;

      box-shadow:
        0 14px 40px
        rgba(23, 32, 51, 0.06);

      margin-bottom: 18px;
    }


    /* ======================================================
       QUESTION
       ====================================================== */

    .section-title {
      font-size: 15px;
      font-weight: 750;

      color: #273449;

      margin-bottom: 12px;
    }

    .question-box {
      position: relative;
    }

    #question {
      width: 100%;
      min-height: 150px;

      resize: vertical;

      border:
        1.5px solid
        #dce5f1;

      border-radius: 18px;

      padding:
        16px
        15px;

      outline: none;

      font-size: 16px;
      line-height: 1.9;

      color: #172033;
      background: #fbfdff;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    #question::placeholder {
      color: #9aa6b6;
    }

    #question:focus {
      border-color: #6ea4ff;

      background: #ffffff;

      box-shadow:
        0 0 0 4px
        rgba(64, 133, 255, 0.09);
    }


    /* ======================================================
       SMALL ACTIONS
       ====================================================== */

    .small-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;

      margin-top: 12px;
    }

    .small-btn {
      min-height: 42px;

      border:
        1px solid
        #dbe4ef;

      background: #ffffff;
      color: #334155;

      border-radius: 13px;

      padding:
        9px
        14px;

      font-size: 14px;
      font-weight: 650;

      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;
    }

    .small-btn:active {
      transform: scale(0.98);
    }


    /* ======================================================
       IMAGE PICKER
       ====================================================== */

    .image-area {
      margin-top: 17px;
    }

    .image-picker {
      width: 100%;

      border:
        1.5px dashed
        #cbd9eb;

      background: #f9fcff;

      border-radius: 18px;

      padding: 17px;

      text-align: center;
      cursor: pointer;

      color: #526174;
    }

    .image-picker:active {
      background: #f2f7ff;
    }

    .image-picker-icon {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .image-picker-title {
      font-size: 15px;
      font-weight: 700;

      color: #334155;
    }

    .image-picker-subtitle {
      font-size: 12px;
      color: #8a97a8;

      margin-top: 5px;
    }

    #imageInput {
      display: none;
    }


    /* ======================================================
       IMAGE PREVIEW
       ====================================================== */

    #imagePreviewArea {
      display: none;
      margin-top: 14px;
    }

    .preview-card {
      border:
        1px solid
        #e1e9f3;

      border-radius: 18px;

      padding: 10px;

      background: #ffffff;
    }

    #imagePreview {
      display: block;

      width: 100%;
      max-height: 390px;

      object-fit: contain;

      border-radius: 13px;

      background: #f4f7fa;
    }

    .preview-actions {
      display: flex;
      gap: 9px;

      margin-top: 10px;
    }

    .preview-actions button {
      flex: 1;
    }

    .delete-btn {
      color: #c93636;
      border-color: #f0caca;
    }


    /* ======================================================
       SOLVE
       ====================================================== */

    .solve-btn {
      width: 100%;
      min-height: 54px;

      margin-top: 18px;

      border: 0;
      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #256ef5,
          #4d91ff
        );

      color: #ffffff;

      font-size: 17px;
      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 11px 25px
        rgba(37, 110, 245, 0.20);
    }

    .solve-btn:active {
      transform: scale(0.99);
    }

    .solve-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      box-shadow: none;
    }


    /* ======================================================
       STATUS
       ====================================================== */

    #status {
      display: none;

      margin-top: 14px;

      border-radius: 14px;

      padding:
        12px
        14px;

      font-size: 14px;
      line-height: 1.7;
    }

    #status.loading {
      display: block;

      background: #f1f6ff;

      border:
        1px solid
        #d8e6ff;

      color: #315f9f;
    }

    #status.error {
      display: block;

      background: #fff4f4;

      border:
        1px solid
        #f2d2d2;

      color: #ad3030;
    }

    #status.success {
      display: block;

      background: #f1fbf5;

      border:
        1px solid
        #d1efdc;

      color: #267448;
    }


    /* ======================================================
       ANSWER
       ====================================================== */

    #answerCard {
      display: none;
    }

    .answer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 15px;
    }

    .answer-title {
      margin: 0;

      font-size: 18px;
      font-weight: 800;

      color: #172033;
    }

    #answer {
      direction: rtl;
      text-align: right;

      color: #1f2937;

      font-size: 16px;
      line-height: 2;

      overflow: hidden;

      word-break: normal;
      overflow-wrap: break-word;
    }


    /* ======================================================
       HEADING
       ====================================================== */

    .answer-heading {
      margin:
        24px
        0
        12px;

      padding-bottom: 8px;

      border-bottom:
        1px solid
        #edf1f6;

      color: #152238;

      font-size: 18px;
      line-height: 1.6;

      font-weight: 800;
    }

    .answer-heading:first-child {
      margin-top: 0;
    }


    /* ======================================================
       PARAGRAPH V2
       ====================================================== */

    .answer-paragraph {
      display: block;

      margin:
        11px
        0;

      direction: rtl;
      text-align: right;

      line-height: 2.15;

      unicode-bidi: plaintext;
    }

    .paragraph-text {
      white-space: pre-wrap;
    }


    /* ======================================================
       INLINE MATH V2
       ====================================================== */

    .inline-math {
      display: inline-block;

      direction: ltr;

      unicode-bidi: isolate;

      text-align: left;

      vertical-align: middle;

      margin:
        0
        3px;

      max-width: 100%;
    }

    .inline-math mjx-container {
      display: inline-block !important;

      direction: ltr !important;

      margin:
        0
        1px !important;

      vertical-align: middle !important;
    }

    .inline-math svg {
      display: inline-block;

      height: auto;

      vertical-align: middle;
    }


    /* ======================================================
       DISPLAY MATH
       ====================================================== */

    .math-block {
      position: relative;

      direction: ltr;

      text-align: center;

      width: 100%;

      margin:
        15px
        0;

      padding:
        13px
        10px;

      background: #fbfdff;

      border:
        1px solid
        #e8eef6;

      border-radius: 15px;

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling: touch;
    }

    .math-content {
      display: inline-block;

      direction: ltr;

      text-align: left;

      min-width: max-content;

      unicode-bidi: isolate;
    }

    .math-block mjx-container {
      display: inline-block !important;

      margin: 0 !important;

      direction: ltr !important;

      text-align: left !important;
    }

    .math-block svg {
      display: inline-block;

      height: auto;

      vertical-align: middle;
    }


    /* ======================================================
       MATHJAX ACCESSIBILITY
       ====================================================== */

    mjx-assistive-mml {
      position: absolute !important;

      width: 1px !important;
      height: 1px !important;

      padding: 0 !important;
      margin: -1px !important;

      overflow: hidden !important;

      clip: rect(0, 0, 0, 0) !important;
      clip-path: inset(50%) !important;

      white-space: nowrap !important;

      border: 0 !important;
    }


    /* ======================================================
       ACTIONS
       ====================================================== */

    .answer-actions {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin-top: 18px;
    }

    .answer-action-btn {
      min-height: 45px;

      border:
        1px solid
        #dce5ef;

      border-radius: 13px;

      background: #ffffff;
      color: #334155;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .answer-action-btn:active {
      transform: scale(0.98);
    }


    /* ======================================================
       FEEDBACK
       ====================================================== */

    .feedback {
      margin-top: 20px;

      padding-top: 16px;

      border-top:
        1px solid
        #edf1f5;

      text-align: center;
    }

    .feedback-title {
      font-size: 13px;

      color: #758196;

      margin-bottom: 10px;
    }

    .feedback-buttons {
      display: flex;
      justify-content: center;

      gap: 10px;
    }

    .feedback-btn {
      min-width: 82px;
      min-height: 39px;

      border-radius: 12px;

      background: #ffffff;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .yes-btn {
      border:
        1px solid
        #bfe5ce;

      color: #23834c;
    }

    .no-btn {
      border:
        1px solid
        #efc6c6;

      color: #c13c3c;
    }


    /* ======================================================
       FOOTER
       ====================================================== */

    .footer {
      text-align: center;

      color: #9aa4b2;

      font-size: 12px;

      margin-top: 24px;

      padding: 8px;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 520px) {

      .app {
        padding:
          14px
          12px
          40px;
      }

      .header {
        padding-bottom: 19px;
      }

      .logo {
        width: 56px;
        height: 56px;

        border-radius: 18px;

        font-size: 24px;
      }

      .title {
        font-size: 24px;
      }

      .card {
        border-radius: 21px;

        padding: 15px;
      }

      #question {
        min-height: 145px;

        font-size: 16px;
      }

      #answer {
        font-size: 16px;

        line-height: 1.95;
      }

      .answer-paragraph {
        line-height: 2.1;
      }

      .answer-actions {
        grid-template-columns: 1fr;
      }

      .math-block {
        padding:
          12px
          8px;
      }

    }

  </style>


  <!-- ======================================================
       MATHJAX
       ====================================================== -->

  <script>

    window.MathJax = {

      tex: {

        packages: {
          "[+]": [
            "ams"
          ]
        },

        processEscapes: true

      },

      loader: {

        load: [
          "[tex]/ams"
        ]

      },

      svg: {

        fontCache: "local",

        displayAlign: "center"

      },

      startup: {

        typeset: false

      }

    };

  </script>


  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"
  ></script>

</head>


<body>

  <main class="app">


    <!-- ====================================================
         HEADER
         ==================================================== -->

    <header class="header">

      <div class="logo">
        1
      </div>

      <h1 class="title">
        ONE Study
      </h1>

      <p class="subtitle">
        مساعدك الدراسي بالذكاء الاصطناعي
        لشرح وحل الأسئلة بطريقة واضحة ومنظمة.
      </p>

    </header>


    <!-- ====================================================
         QUESTION CARD
         ==================================================== -->

    <section class="card">

      <div class="section-title">
        اكتب سؤالك
      </div>


      <div class="question-box">

        <textarea
          id="question"
          placeholder="اكتب السؤال هنا، أو اختر صورة للسؤال..."
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>

      </div>


      <div class="small-actions">

        <button
          type="button"
          class="small-btn"
          id="pasteBtn"
        >
          لصق
        </button>


        <button
          type="button"
          class="small-btn"
          id="clearBtn"
        >
          مسح
        </button>

      </div>


      <!-- ==================================================
           IMAGE
           ================================================== -->

      <div class="image-area">

        <label
          class="image-picker"
          for="imageInput"
        >

          <div class="image-picker-icon">
            🖼️
          </div>

          <div class="image-picker-title">
            اختر صورة السؤال
          </div>

          <div class="image-picker-subtitle">
            يمكنك اختيار صورة من ألبوم الصور
          </div>

        </label>


        <input
          id="imageInput"
          type="file"
          accept="image/*"
        >


        <div id="imagePreviewArea">

          <div class="preview-card">

            <img
              id="imagePreview"
              alt="معاينة صورة السؤال"
            >


            <div class="preview-actions">

              <button
                type="button"
                class="small-btn"
                id="changeImageBtn"
              >
                تغيير الصورة
              </button>


              <button
                type="button"
                class="small-btn delete-btn"
                id="removeImageBtn"
              >
                حذف الصورة
              </button>

            </div>

          </div>

        </div>

      </div>


      <!-- ==================================================
           SOLVE
           ================================================== -->

      <button
        type="button"
        class="solve-btn"
        id="solveBtn"
      >
        حل السؤال
      </button>


      <div
        id="status"
        role="status"
        aria-live="polite"
      ></div>

    </section>


    <!-- ====================================================
         ANSWER
         ==================================================== -->

    <section
      class="card"
      id="answerCard"
    >

      <div class="answer-header">

        <h2 class="answer-title">
          الإجابة
        </h2>

      </div>


      <div id="answer"></div>


      <div class="answer-actions">

        <button
          type="button"
          class="answer-action-btn"
          id="copyBtn"
        >
          نسخ الإجابة
        </button>


        <button
          type="button"
          class="answer-action-btn"
          id="saveBtn"
        >
          حفظ الإجابة
        </button>


        <button
          type="button"
          class="answer-action-btn"
          id="shareBtn"
        >
          مشاركة
        </button>

      </div>


      <div class="feedback">

        <div class="feedback-title">
          هل كانت الإجابة مفيدة؟
        </div>


        <div class="feedback-buttons">

          <button
            type="button"
            class="feedback-btn yes-btn"
            id="yesBtn"
          >
            نعم
          </button>


          <button
            type="button"
            class="feedback-btn no-btn"
            id="noBtn"
          >
            لا
          </button>

        </div>

      </div>

    </section>


    <footer class="footer">
      ONE Study
    </footer>


  </main>


  <script>

    /* ======================================================
       ELEMENTS
       ====================================================== */

    const questionInput =
      document.getElementById("question");

    const imageInput =
      document.getElementById("imageInput");

    const imagePreviewArea =
      document.getElementById("imagePreviewArea");

    const imagePreview =
      document.getElementById("imagePreview");

    const solveBtn =
      document.getElementById("solveBtn");

    const statusBox =
      document.getElementById("status");

    const answerCard =
      document.getElementById("answerCard");

    const answerElement =
      document.getElementById("answer");

    const pasteBtn =
      document.getElementById("pasteBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const changeImageBtn =
      document.getElementById("changeImageBtn");

    const removeImageBtn =
      document.getElementById("removeImageBtn");

    const copyBtn =
      document.getElementById("copyBtn");

    const saveBtn =
      document.getElementById("saveBtn");

    const shareBtn =
      document.getElementById("shareBtn");

    const yesBtn =
      document.getElementById("yesBtn");

    const noBtn =
      document.getElementById("noBtn");


    /* ======================================================
       STATE
       ====================================================== */

    let selectedImageDataURL = null;

    let currentBlocks = [];


    /* ======================================================
       STATUS
       ====================================================== */

    function showStatus(
      message,
      type = "loading"
    ) {

      statusBox.textContent =
        message;

      statusBox.className =
        type;

      statusBox.style.display =
        "block";

    }


    function hideStatus() {

      statusBox.textContent =
        "";

      statusBox.className =
        "";

      statusBox.style.display =
        "none";

    }


    /* ======================================================
       FILE → DATA URL
       ====================================================== */

    async function fileToDataURL(file) {

      const buffer =
        await file.arrayBuffer();

      const bytes =
        new Uint8Array(buffer);

      const chunkSize =
        0x8000;

      let binary =
        "";


      for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
      ) {

        const chunk =
          bytes.subarray(
            i,
            i + chunkSize
          );


        binary +=
          String.fromCharCode.apply(
            null,
            chunk
          );

      }


      const base64 =
        btoa(binary);


      return (
        "data:" +
        file.type +
        ";base64," +
        base64
      );

    }


    /* ======================================================
       IMAGE SELECT
       ====================================================== */

    imageInput.addEventListener(
      "change",
      async function () {

        const file =
          imageInput.files &&
          imageInput.files[0];


        if (!file) {
          return;
        }


        if (
          !file.type ||
          !file.type.startsWith("image/")
        ) {

          showStatus(
            "يرجى اختيار ملف صورة صالح.",
            "error"
          );

          imageInput.value =
            "";

          return;

        }


        try {

          showStatus(
            "جاري تجهيز الصورة...",
            "loading"
          );


          selectedImageDataURL =
            await fileToDataURL(file);


          imagePreview.src =
            selectedImageDataURL;


          imagePreviewArea.style.display =
            "block";


          hideStatus();


        } catch (error) {

          console.error(
            "IMAGE ERROR:",
            error
          );


          selectedImageDataURL =
            null;


          imageInput.value =
            "";


          showStatus(
            "تعذر قراءة الصورة. حاول اختيارها مرة أخرى.",
            "error"
          );

        }

      }
    );


    /* ======================================================
       CHANGE IMAGE
       ====================================================== */

    changeImageBtn.addEventListener(
      "click",
      function () {

        imageInput.click();

      }
    );


    /* ======================================================
       REMOVE IMAGE
       ====================================================== */

    removeImageBtn.addEventListener(
      "click",
      function () {

        selectedImageDataURL =
          null;


        imageInput.value =
          "";


        imagePreview.removeAttribute(
          "src"
        );


        imagePreviewArea.style.display =
          "none";

      }
    );


    /* ======================================================
       PASTE
       ====================================================== */

    pasteBtn.addEventListener(
      "click",
      async function () {

        try {

          if (
            navigator.clipboard &&
            navigator.clipboard.readText
          ) {

            const text =
              await navigator.clipboard.readText();


            if (text) {

              questionInput.value =
                text;


              questionInput.focus();

            }

          } else {

            questionInput.focus();

          }


        } catch (error) {

          console.error(
            "PASTE ERROR:",
            error
          );


          questionInput.focus();

        }

      }
    );


    /* ======================================================
       CLEAR
       ====================================================== */

    clearBtn.addEventListener(
      "click",
      function () {

        questionInput.value =
          "";


        selectedImageDataURL =
          null;


        imageInput.value =
          "";


        imagePreview.removeAttribute(
          "src"
        );


        imagePreviewArea.style.display =
          "none";


        currentBlocks =
          [];


        answerElement.replaceChildren();


        answerCard.style.display =
          "none";


        hideStatus();


        questionInput.focus();

      }
    );


    /* ======================================================
       WAIT FOR MATHJAX
       ====================================================== */

    async function waitForMathJax() {

      const maxAttempts =
        100;


      for (
        let attempt = 0;
        attempt < maxAttempts;
        attempt++
      ) {

        if (
          window.MathJax &&
          typeof window.MathJax.tex2svgPromise ===
            "function"
        ) {

          if (
            window.MathJax.startup &&
            window.MathJax.startup.promise
          ) {

            await window.MathJax.startup.promise;

          }


          return true;

        }


        await new Promise(
          (resolve) =>
            setTimeout(
              resolve,
              100
            )
        );

      }


      return false;

    }


    /* ======================================================
       HEADING
       ====================================================== */

    function createHeadingBlock(
      content
    ) {

      const element =
        document.createElement("div");


      element.className =
        "answer-heading";


      element.textContent =
        content;


      return element;

    }


    /* ======================================================
       INLINE MATH
       ====================================================== */

    function createInlineMath(
      tex
    ) {

      const element =
        document.createElement("span");


      element.className =
        "inline-math";


      element.dataset.tex =
        tex;


      element.dataset.display =
        "false";


      element.textContent =
        "";


      return element;

    }


    /* ======================================================
       PARAGRAPH V2
       ====================================================== */

    function createParagraphBlock(
      segments
    ) {

      const paragraph =
        document.createElement("div");


      paragraph.className =
        "answer-paragraph";


      if (
        !Array.isArray(segments)
      ) {

        return paragraph;

      }


      for (
        const segment of segments
      ) {

        if (
          !segment ||
          typeof segment.content !==
            "string"
        ) {

          continue;

        }


        const content =
          segment.content.trim();


        if (!content) {
          continue;
        }


        if (
          segment.type ===
          "text"
        ) {

          const span =
            document.createElement(
              "span"
            );


          span.className =
            "paragraph-text";


          span.textContent =
            content;


          paragraph.appendChild(
            span
          );

        }


        else if (
          segment.type ===
          "inline_math"
        ) {

          paragraph.appendChild(
            createInlineMath(
              content
            )
          );

        }

      }


      return paragraph;

    }


    /* ======================================================
       DISPLAY MATH
       ====================================================== */

    function createMathBlock(
      tex
    ) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "math-block";


      const mathContent =
        document.createElement("div");


      mathContent.className =
        "math-content";


      mathContent.dataset.tex =
        tex;


      mathContent.dataset.display =
        "true";


      mathContent.textContent =
        "";


      wrapper.appendChild(
        mathContent
      );


      return wrapper;

    }


    /* ======================================================
       HIDE ASSISTIVE DUPLICATE
       ====================================================== */

    function hideAssistiveMath(
      rendered
    ) {

      if (!rendered) {
        return;
      }


      rendered
        .querySelectorAll(
          "mjx-assistive-mml"
        )
        .forEach(
          (node) => {

            node.style.position =
              "absolute";

            node.style.width =
              "1px";

            node.style.height =
              "1px";

            node.style.padding =
              "0";

            node.style.margin =
              "-1px";

            node.style.overflow =
              "hidden";

            node.style.clip =
              "rect(0, 0, 0, 0)";

            node.style.clipPath =
              "inset(50%)";

            node.style.whiteSpace =
              "nowrap";

            node.style.border =
              "0";

          }
        );

    }


    /* ======================================================
       RENDER MATH ELEMENT
       ====================================================== */

    async function renderMathElement(
      element
    ) {

      const tex =
        element.dataset.tex;


      if (!tex) {
        return;
      }


      const isDisplay =
        element.dataset.display ===
        "true";


      try {

        const rendered =
          await window.MathJax.tex2svgPromise(
            tex,
            {
              display:
                isDisplay
            }
          );


        hideAssistiveMath(
          rendered
        );


        element.replaceChildren(
          rendered
        );


      } catch (error) {

        console.error(
          "MATHJAX RENDER ERROR:",
          error,
          tex
        );


        /*
          Fallback:
          show raw TeX once only.
        */

        element.textContent =
          tex;

      }

    }


    /* ======================================================
       VALIDATE V2 BLOCK
       ====================================================== */

    function isValidBlock(
      block
    ) {

      if (
        !block ||
        typeof block !== "object"
      ) {

        return false;

      }


      if (
        block.type === "heading"
      ) {

        return (
          typeof block.content ===
            "string" &&
          block.content.trim()
        );

      }


      if (
        block.type === "math"
      ) {

        return (
          typeof block.content ===
            "string" &&
          block.content.trim()
        );

      }


      if (
        block.type === "paragraph"
      ) {

        return (
          Array.isArray(
            block.segments
          ) &&
          block.segments.length > 0
        );

      }


      return false;

    }


    /* ======================================================
       RENDER STRUCTURED BLOCKS V2
       ====================================================== */

    async function renderBlocks(
      blocks
    ) {

      answerElement.replaceChildren();


      if (
        !Array.isArray(blocks)
      ) {

        throw new Error(
          "صيغة الإجابة غير صحيحة."
        );

      }


      const validBlocks =
        blocks.filter(
          isValidBlock
        );


      if (
        validBlocks.length === 0
      ) {

        throw new Error(
          "لم تصل إجابة قابلة للعرض."
        );

      }


      const fragment =
        document.createDocumentFragment();


      for (
        const block of validBlocks
      ) {

        if (
          block.type ===
          "heading"
        ) {

          fragment.appendChild(
            createHeadingBlock(
              block.content.trim()
            )
          );

        }


        else if (
          block.type ===
          "paragraph"
        ) {

          fragment.appendChild(
            createParagraphBlock(
              block.segments
            )
          );

        }


        else if (
          block.type ===
          "math"
        ) {

          fragment.appendChild(
            createMathBlock(
              block.content.trim()
            )
          );

        }

      }


      answerElement.appendChild(
        fragment
      );


      /*
        Both inline_math and display math
        are rendered from explicit structured data.
      */

      const mathElements =
        answerElement.querySelectorAll(
          ".math-content, .inline-math"
        );


      if (
        mathElements.length === 0
      ) {

        return;

      }


      const mathJaxReady =
        await waitForMathJax();


      if (!mathJaxReady) {

        console.error(
          "MathJax failed to load."
        );


        mathElements.forEach(
          (element) => {

            element.textContent =
              element.dataset.tex ||
              "";

          }
        );


        return;

      }


      for (
        const element of mathElements
      ) {

        await renderMathElement(
          element
        );

      }

    }


    /* ======================================================
       ASK AI
       ====================================================== */

    async function askAI() {

      const question =
        questionInput.value.trim();


      if (
        !question &&
        !selectedImageDataURL
      ) {

        showStatus(
          "اكتب سؤالاً أو اختر صورة أولاً.",
          "error"
        );

        return;

      }


      solveBtn.disabled =
        true;


      solveBtn.textContent =
        "جاري الحل...";


      answerCard.style.display =
        "none";


      answerElement.replaceChildren();


      currentBlocks =
        [];


      showStatus(
        "جاري قراءة السؤال وإعداد الحل...",
        "loading"
      );


      try {

        const response =
          await fetch(
            "/ask",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  question:
                    question,

                  image:
                    selectedImageDataURL

                })

            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch (jsonError) {

          throw new Error(
            "وصل رد غير صالح من الخادم."
          );

        }


        if (
          !response.ok
        ) {

          throw new Error(
            data?.error ||
            "حدث خطأ أثناء معالجة السؤال."
          );

        }


        /*
          Structured Blocks V2:

          {
            version: 2,

            blocks: [

              {
                type: "heading",
                content: "الحل"
              },

              {
                type: "paragraph",

                segments: [
                  {
                    type: "text",
                    content: "..."
                  },
                  {
                    type: "inline_math",
                    content: "..."
                  }
                ]
              },

              {
                type: "math",
                content: "..."
              }

            ]
          }
        */


        if (
          data.version !== 2
        ) {

          console.warn(
            "Unexpected response version:",
            data.version
          );

        }


        if (
          !Array.isArray(
            data.blocks
          )
        ) {

          throw new Error(
            "الخادم لم يرسل Structured Blocks V2 بالصورة المتوقعة."
          );

        }


        currentBlocks =
          data.blocks;


        await renderBlocks(
          currentBlocks
        );


        hideStatus();


        answerCard.style.display =
          "block";


        setTimeout(
          function () {

            answerCard.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          },
          100
        );


      } catch (error) {

        console.error(
          "ASK ERROR:",
          error
        );


        showStatus(
          error?.message ||
          "تعذر الحصول على الإجابة.",
          "error"
        );

      } finally {

        solveBtn.disabled =
          false;


        solveBtn.textContent =
          "حل السؤال";

      }

    }


    solveBtn.addEventListener(
      "click",
      askAI
    );


    /* ======================================================
       V2 → PLAIN TEXT
       ====================================================== */

    function blocksToPlainText() {

      if (
        !Array.isArray(
          currentBlocks
        )
      ) {

        return "";

      }


      const parts =
        [];


      for (
        const block of currentBlocks
      ) {

        if (!block) {
          continue;
        }


        /* HEADING */

        if (
          block.type ===
          "heading" &&
          typeof block.content ===
            "string"
        ) {

          const content =
            block.content.trim();


          if (content) {

            parts.push(
              content
            );

          }


          continue;

        }


        /* DISPLAY MATH */

        if (
          block.type ===
          "math" &&
          typeof block.content ===
            "string"
        ) {

          const content =
            block.content.trim();


          if (content) {

            parts.push(
              content
            );

          }


          continue;

        }


        /* PARAGRAPH */

        if (
          block.type ===
            "paragraph" &&
          Array.isArray(
            block.segments
          )
        ) {

          let paragraphText =
            "";


          for (
            const segment of
            block.segments
          ) {

            if (
              !segment ||
              typeof segment.content !==
                "string"
            ) {

              continue;

            }


            const content =
              segment.content.trim();


            if (!content) {
              continue;
            }


            /*
              Add a controlled space between
              text and inline math segments.
            */

            if (
              paragraphText &&
              !paragraphText.endsWith(" ")
            ) {

              paragraphText +=
                " ";

            }


            paragraphText +=
              content;

          }


          if (
            paragraphText.trim()
          ) {

            parts.push(
              paragraphText.trim()
            );

          }

        }

      }


      return parts
        .join("\n\n")
        .trim();

    }


    /* ======================================================
       COPY
       ====================================================== */

    copyBtn.addEventListener(
      "click",
      async function () {

        const text =
          blocksToPlainText();


        if (!text) {
          return;
        }


        try {

          if (
            navigator.clipboard &&
            navigator.clipboard.writeText
          ) {

            await navigator.clipboard.writeText(
              text
            );


            showStatus(
              "تم نسخ الإجابة.",
              "success"
            );


            setTimeout(
              hideStatus,
              1800
            );

          } else {

            throw new Error(
              "Clipboard unavailable"
            );

          }


        } catch (error) {

          console.error(
            "COPY ERROR:",
            error
          );


          const textarea =
            document.createElement(
              "textarea"
            );


          textarea.value =
            text;


          textarea.style.position =
            "fixed";


          textarea.style.opacity =
            "0";


          document.body.appendChild(
            textarea
          );


          textarea.focus();
          textarea.select();


          try {

            document.execCommand(
              "copy"
            );


            showStatus(
              "تم نسخ الإجابة.",
              "success"
            );


            setTimeout(
              hideStatus,
              1800
            );


          } catch (
            fallbackError
          ) {

            showStatus(
              "تعذر نسخ الإجابة تلقائياً.",
              "error"
            );

          }


          textarea.remove();

        }

      }
    );


    /* ======================================================
       SAVE
       ====================================================== */

    saveBtn.addEventListener(
      "click",
      function () {

        const text =
          blocksToPlainText();


        if (!text) {
          return;
        }


        try {

          const blob =
            new Blob(
              [text],
              {
                type:
                  "text/plain;charset=utf-8"
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;


          link.download =
            "ONE-Study-answer.txt";


          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          setTimeout(
            function () {

              URL.revokeObjectURL(
                url
              );

            },
            1000
          );


          showStatus(
            "تم تجهيز الإجابة للحفظ.",
            "success"
          );


          setTimeout(
            hideStatus,
            1800
          );


        } catch (error) {

          console.error(
            "SAVE ERROR:",
            error
          );


          showStatus(
            "تعذر حفظ الإجابة.",
            "error"
          );

        }

      }
    );


    /* ======================================================
       SHARE
       ====================================================== */

    shareBtn.addEventListener(
      "click",
      async function () {

        const text =
          blocksToPlainText();


        if (!text) {
          return;
        }


        try {

          if (
            navigator.share
          ) {

            await navigator.share({

              title:
                "ONE Study",

              text:
                text

            });

          }


          else if (
            navigator.clipboard &&
            navigator.clipboard.writeText
          ) {

            await navigator.clipboard.writeText(
              text
            );


            showStatus(
              "المشاركة غير متاحة هنا، لذلك تم نسخ الإجابة.",
              "success"
            );


            setTimeout(
              hideStatus,
              2200
            );

          }


          else {

            showStatus(
              "المشاركة غير متاحة في هذا المتصفح.",
              "error"
            );

          }


        } catch (error) {

          if (
            error &&
            error.name ===
              "AbortError"
          ) {

            return;

          }


          console.error(
            "SHARE ERROR:",
            error
          );

        }

      }
    );


    /* ======================================================
       FEEDBACK
       ====================================================== */

    yesBtn.addEventListener(
      "click",
      function () {

        showStatus(
          "شكراً لتقييمك.",
          "success"
        );


        setTimeout(
          hideStatus,
          1800
        );

      }
    );


    noBtn.addEventListener(
      "click",
      function () {

        showStatus(
          "شكراً لملاحظتك. سنحاول تقديم إجابة أوضح.",
          "success"
        );


        setTimeout(
          hideStatus,
          2200
        );

      }
    );


    /* ======================================================
       INITIAL
       ====================================================== */

    hideStatus();

  </script>
