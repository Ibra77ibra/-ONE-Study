<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ONE Study</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 42px 20px 58px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: -32px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 23px;
      text-align: right;
    }

    textarea {
      width: 100%;
      min-height: 155px;
      border: 1px solid #dbe2ea;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      direction: rtl;
      text-align: right;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .image-box {
      margin-top: 17px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
    }

    .image-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    input[type="file"] {
      width: 100%;
      font-size: 15px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
      margin-top: 18px;
      background: white;
    }

    .image-status {
      display: none;
      margin-top: 12px;
      color: #15803d;
      font-weight: 700;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 16px;
      padding: 17px;
      font-size: 20px;
      font-weight: 700;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 22px 10px;
      color: #475569;
      font-size: 17px;
      font-weight: 600;
    }

    .answer {
      display: none;
      margin-top: 20px;
      background: #eef4ff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 20px;
      line-height: 1.9;
      font-size: 17px;
      white-space: pre-wrap;
      text-align: right;
      direction: rtl;
      unicode-bidi: plaintext;
      overflow-wrap: anywhere;
    }

    .answer.error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;
    }

    .note {
      font-size: 14px;
      color: #64748b;
      margin-top: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header {
        padding: 38px 16px 55px;
      }

      .logo {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">ONE Study</div>

    <div class="subtitle">
      مساعدك الدراسي بالذكاء الاصطناعي
    </div>
  </div>


  <div class="container">

    <div class="card">

      <h2>ما السؤال الذي تريد حله؟</h2>

      <textarea
        id="question"
        placeholder="اكتب السؤال هنا..."
      ></textarea>


      <div class="image-box">

        <div class="image-title">
          📷 صوّر أو اختر صورة للسؤال
        </div>

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
        >

        <div
          id="imageStatus"
          class="image-status"
        >
          ✓ تم اختيار الصورة
        </div>

        <img
          id="preview"
          alt="معاينة صورة السؤال"
        >

      </div>


      <button
        id="askButton"
        type="button"
      >
        حل السؤال
      </button>


      <div
        id="loading"
        class="loading"
      >
        جاري تحليل السؤال...
      </div>


      <div
        id="answer"
        class="answer"
      ></div>


      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>

    </div>

  </div>


<script>
(function () {

  "use strict";

  var API_URL = "/ask";

  var questionInput =
    document.getElementById("question");

  var imageInput =
    document.getElementById("imageInput");

  var preview =
    document.getElementById("preview");

  var imageStatus =
    document.getElementById("imageStatus");

  var askButton =
    document.getElementById("askButton");

  var loading =
    document.getElementById("loading");

  var answer =
    document.getElementById("answer");


  /*
   * تحويل الصورة إلى Base64 بدون FileReader.
   * نستخدم Blob + fetch + ArrayBuffer.
   */
  async function fileToDataURL(file) {

    var buffer =
      await file.arrayBuffer();

    var bytes =
      new Uint8Array(buffer);

    var binary = "";

    var chunkSize = 0x8000;

    for (
      var i = 0;
      i < bytes.length;
      i += chunkSize
    ) {

      var chunk =
        bytes.subarray(
          i,
          Math.min(
            i + chunkSize,
            bytes.length
          )
        );

      binary +=
        String.fromCharCode.apply(
          null,
          chunk
        );
    }

    var base64 =
      btoa(binary);

    var mimeType =
      file.type || "image/jpeg";

    return (
      "data:" +
      mimeType +
      ";base64," +
      base64
    );
  }


  /*
   * اختيار ومعاينة الصورة
   */
  imageInput.addEventListener(
    "change",
    function () {

      var file =
        imageInput.files &&
        imageInput.files.length > 0
          ? imageInput.files[0]
          : null;


      imageStatus.style.display =
        "none";

      preview.style.display =
        "none";

      preview.removeAttribute("src");


      if (!file) {
        return;
      }


      if (
        file.type &&
        file.type.indexOf("image/") !== 0
      ) {

        imageInput.value = "";

        alert(
          "الملف المختار ليس صورة."
        );

        return;
      }


      var maxSize =
        10 * 1024 * 1024;


      if (file.size > maxSize) {

        imageInput.value = "";

        alert(
          "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
        );

        return;
      }


      imageStatus.style.display =
        "block";


      /*
       * المعاينة باستخدام Object URL.
       */
      if (
        window.URL &&
        window.URL.createObjectURL
      ) {

        var imageURL =
          window.URL.createObjectURL(file);

        preview.onload =
          function () {

            if (
              window.URL &&
              window.URL.revokeObjectURL
            ) {

              window.URL.revokeObjectURL(
                imageURL
              );
            }

          };

        preview.src =
          imageURL;

        preview.style.display =
          "block";
      }

    }
  );


  /*
   * عرض الخطأ
   */
  function showError(message) {

    answer.classList.add(
      "error"
    );

    answer.textContent =
      "تعذر الحصول على الإجابة:\n" +
      message;

    answer.style.display =
      "block";

    try {

      answer.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (e) {

      answer.scrollIntoView();

    }
  }


  /*
   * عرض الإجابة
   */
  function showAnswer(text) {

    answer.classList.remove(
      "error"
    );

    answer.textContent =
      text;

    answer.style.display =
      "block";

    try {

      answer.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (e) {

      answer.scrollIntoView();

    }
  }


  /*
   * حل السؤال
   */
  async function askAI() {

    var question =
      questionInput.value.trim();

    var file =
      imageInput.files &&
      imageInput.files.length > 0
        ? imageInput.files[0]
        : null;


    if (!question && !file) {

      alert(
        "اكتب سؤالاً أو اختر صورة أولاً."
      );

      return;
    }


    askButton.disabled = true;

    answer.style.display = "none";

    answer.textContent = "";

    answer.classList.remove(
      "error"
    );

    loading.style.display =
      "block";


    try {

      var imageData = null;


      if (file) {

        loading.textContent =
          "جاري تجهيز الصورة...";

        imageData =
          await fileToDataURL(file);

      }


      loading.textContent =
        "جاري تحليل السؤال والصورة...";


      var response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                question: question,
                image: imageData
              })
          }
        );


      var responseText =
        await response.text();


      var data;


      try {

        data =
          JSON.parse(
            responseText
          );

      } catch (e) {

        throw new Error(
          "الخادم أعاد استجابة غير صالحة."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "حدث خطأ أثناء معالجة السؤال."
        );

      }


      var finalAnswer =
        data.answer ||
        data.output ||
        data.response;


      if (!finalAnswer) {

        throw new Error(
          "تم الاتصال بالخادم ولكن لم تصل إجابة."
        );

      }


      showAnswer(
        finalAnswer
      );


    } catch (error) {

      console.error(
        "ONE STUDY ERROR:",
        error
      );

      showError(
        error &&
        error.message
          ? error.message
          : "حدث خطأ غير معروف."
      );


    } finally {

      loading.style.display =
        "none";

      loading.textContent =
        "جاري تحليل السؤال...";

      askButton.disabled =
        false;

    }

  }


  askButton.addEventListener(
    "click",
    function () {
      askAI();
    }
  );

})();
</script>

</body>
</html>
