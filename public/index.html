<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta
    name="theme-color"
    content="#f5f9ff"
  >

  <title>ONE Study</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #f7fbff 0%,
          #ffffff 42%,
          #f8fbff 100%
        );

      color: #172033;
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      touch-action: manipulation;
    }


    /* ======================================================
       APP
       ====================================================== */

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }


    /* ======================================================
       HEADER
       ====================================================== */

    .header {
      text-align: center;
      padding: 14px 8px 24px;
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 12px;
      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 27px;
      font-weight: 800;
      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #2675ff,
          #5c9cff
        );

      box-shadow:
        0 12px 30px
        rgba(38, 117, 255, 0.20);
    }

    .title {
      margin: 0;
      font-size: 27px;
      font-weight: 800;
      color: #111827;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin: 8px auto 0;
      max-width: 520px;
      color: #697386;
      font-size: 14px;
      line-height: 1.8;
    }


    /* ======================================================
       CARD
       ====================================================== */

    .card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #e4ebf5;
      border-radius: 24px;
      padding: 18px;

      box-shadow:
        0 14px 40px
        rgba(23, 32, 51, 0.06);

      margin-bottom: 18px;
    }


    /* ======================================================
       QUESTION
       ====================================================== */

    .section-title {
      font-size: 15px;
      font-weight: 750;
      color: #273449;
      margin-bottom: 12px;
    }

    #question {
      width: 100%;
      min-height: 150px;
      resize: vertical;

      border: 1.5px solid #dce5f1;
      border-radius: 18px;

      padding: 16px 15px;
      outline: none;

      font-size: 16px;
      line-height: 1.9;

      color: #172033;
      background: #fbfdff;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    #question::placeholder {
      color: #9aa6b6;
    }

    #question:focus {
      border-color: #6ea4ff;
      background: #ffffff;

      box-shadow:
        0 0 0 4px
        rgba(64, 133, 255, 0.09);
    }


    /* ======================================================
       BUTTONS
       ====================================================== */

    .small-actions,
    .preview-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .small-btn {
      min-height: 42px;
      border: 1px solid #dbe4ef;
      background: #ffffff;
      color: #334155;
      border-radius: 13px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .small-btn:active,
    .answer-action-btn:active {
      transform: scale(0.98);
    }


    /* ======================================================
       IMAGE
       ====================================================== */

    .image-area {
      margin-top: 17px;
    }

    .image-picker {
      width: 100%;
      display: block;

      border: 1.5px dashed #cbd9eb;
      background: #f9fcff;
      border-radius: 18px;

      padding: 17px;
      text-align: center;
      cursor: pointer;
      color: #526174;
    }

    .image-picker-icon {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .image-picker-title {
      font-size: 15px;
      font-weight: 700;
      color: #334155;
    }

    .image-picker-subtitle {
      font-size: 12px;
      color: #8a97a8;
      margin-top: 5px;
    }

    #imageInput {
      display: none;
    }

    #imagePreviewArea {
      display: none;
      margin-top: 14px;
    }

    .preview-card {
      border: 1px solid #e1e9f3;
      border-radius: 18px;
      padding: 10px;
      background: #ffffff;
    }

    #imagePreview {
      display: block;
      width: 100%;
      max-height: 390px;
      object-fit: contain;
      border-radius: 13px;
      background: #f4f7fa;
    }

    .preview-actions button {
      flex: 1;
    }

    .delete-btn {
      color: #c93636;
      border-color: #f0caca;
    }


    /* ======================================================
       SOLVE
       ====================================================== */

    .solve-btn {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;

      border: 0;
      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #256ef5,
          #4d91ff
        );

      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;

      box-shadow:
        0 11px 25px
        rgba(37, 110, 245, 0.20);
    }

    .solve-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      box-shadow: none;
    }


    /* ======================================================
       STATUS
       ====================================================== */

    #status {
      display: none;
      margin-top: 14px;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.7;
    }

    #status.loading {
      display: block;
      background: #f1f6ff;
      border: 1px solid #d8e6ff;
      color: #315f9f;
    }

    #status.error {
      display: block;
      background: #fff4f4;
      border: 1px solid #f2d2d2;
      color: #ad3030;
    }

    #status.success {
      display: block;
      background: #f1fbf5;
      border: 1px solid #d1efdc;
      color: #267448;
    }


    /* ======================================================
       ANSWER
       ====================================================== */

    #answerCard {
      display: none;
    }

    .answer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .answer-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: #172033;
    }


    /* ======================================================
       QUESTION TYPE V3.3
       ====================================================== */

    #questionTypeBadge {
      display: none;

      width: fit-content;

      margin:
        -2px
        0
        18px;

      padding:
        7px
        12px;

      border-radius: 999px;

      background: #f1f6ff;
      border: 1px solid #dce8ff;

      color: #3568ad;

      font-size: 12px;
      font-weight: 750;
    }


    #answer {
      direction: rtl;
      text-align: right;
      color: #1f2937;
      font-size: 16px;
      line-height: 2;
      overflow: hidden;
      overflow-wrap: break-word;
    }


    /* ======================================================
       HEADING
       ====================================================== */

    .answer-heading {
      margin: 24px 0 12px;
      padding-bottom: 8px;

      border-bottom:
        1px solid
        #edf1f6;

      color: #152238;

      font-size: 18px;
      line-height: 1.6;
      font-weight: 800;
    }

    .answer-heading:first-child {
      margin-top: 0;
    }


    /* ======================================================
       PARAGRAPH V3
       ====================================================== */

    .answer-paragraph {
      display: block;

      margin: 11px 0;

      direction: rtl;
      text-align: right;

      line-height: 2.15;

      unicode-bidi: normal;

      white-space: pre-wrap;
    }


    /* ======================================================
       INLINE MATH V3
       ====================================================== */

    .inline-math {
      display: inline-block;

      direction: ltr !important;

      unicode-bidi: isolate;

      text-align: left;

      vertical-align: middle;

      max-width: 100%;
    }

    .inline-math mjx-container {
      display: inline-block !important;

      direction: ltr !important;

      margin: 0 !important;

      vertical-align: middle !important;
    }

    .inline-math svg {
      display: inline-block;
      height: auto;
      vertical-align: middle;
    }


    /* ======================================================
       DISPLAY MATH
       ====================================================== */

    .math-block {
      position: relative;

      direction: ltr;
      text-align: center;

      width: 100%;

      margin: 15px 0;
      padding: 13px 10px;

      background: #fbfdff;

      border: 1px solid #e8eef6;
      border-radius: 15px;

      overflow-x: auto;
      overflow-y: hidden;

      -webkit-overflow-scrolling: touch;
    }

    .math-content {
      display: inline-block;

      direction: ltr;
      text-align: left;

      min-width: max-content;

      unicode-bidi: isolate;
    }

    .math-block mjx-container {
      display: inline-block !important;
      margin: 0 !important;
      direction: ltr !important;
    }

    .math-block svg {
      display: inline-block;
      height: auto;
      vertical-align: middle;
    }


    /* ======================================================
       STEPS V3.3
       ====================================================== */

    .steps-block {
      margin: 18px 0;
    }

    .step-item {
      position: relative;

      margin: 12px 0;

      padding:
        15px
        16px;

      border:
        1px solid
        #e3ebf5;

      border-radius: 17px;

      background: #fcfdff;
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 9px;
    }

    .step-number {
      flex: 0 0 auto;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eaf2ff;

      color: #2768c7;

      font-size: 13px;
      font-weight: 800;
    }

    .step-title {
      color: #24344d;

      font-size: 15px;
      font-weight: 800;
    }

    .step-content .answer-paragraph:first-child {
      margin-top: 4px;
    }

    .step-content .math-block:last-child {
      margin-bottom: 2px;
    }


    /* ======================================================
       FINAL ANSWER V3.3
       ====================================================== */

    .final-answer-block {
      margin: 24px 0 10px;

      padding:
        17px
        16px;

      border:
        1.5px solid
        #cfe0ff;

      border-radius: 19px;

      background:
        linear-gradient(
          180deg,
          #f5f9ff,
          #fbfdff
        );
    }

    .final-answer-title {
      margin-bottom: 10px;

      color: #215cae;

      font-size: 17px;
      font-weight: 850;
    }

    .final-answer-content
      .math-block {

      background: #ffffff;

      border-color: #dce8f8;
    }


    /* ======================================================
       NOTICE V3.3
       ====================================================== */

    .notice-block {
      margin: 17px 0;

      padding:
        13px
        14px;

      border:
        1px solid
        #e3e9f2;

      border-radius: 15px;

      background: #f8fafc;

      color: #4b596d;

      line-height: 2;
    }

    .notice-label {
      display: block;

      margin-bottom: 4px;

      color: #526174;

      font-size: 13px;
      font-weight: 800;
    }


    /* ======================================================
       MATHJAX ASSISTIVE
       ====================================================== */

    mjx-assistive-mml {
      position: absolute !important;

      width: 1px !important;
      height: 1px !important;

      padding: 0 !important;
      margin: -1px !important;

      overflow: hidden !important;

      clip: rect(0, 0, 0, 0) !important;
      clip-path: inset(50%) !important;

      white-space: nowrap !important;

      border: 0 !important;
    }


    /* ======================================================
       ACTIONS
       ====================================================== */

    .answer-actions {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin-top: 18px;
    }

    .answer-action-btn {
      min-height: 45px;

      border: 1px solid #dce5ef;
      border-radius: 13px;

      background: #ffffff;
      color: #334155;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }


    /* ======================================================
       FEEDBACK
       ====================================================== */

    .feedback {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #edf1f5;
      text-align: center;
    }

    .feedback-title {
      font-size: 13px;
      color: #758196;
      margin-bottom: 10px;
    }

    .feedback-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .feedback-btn {
      min-width: 82px;
      min-height: 39px;

      border-radius: 12px;
      background: #ffffff;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }

    .yes-btn {
      border: 1px solid #bfe5ce;
      color: #23834c;
    }

    .no-btn {
      border: 1px solid #efc6c6;
      color: #c13c3c;
    }


    .footer {
      text-align: center;
      color: #9aa4b2;
      font-size: 12px;
      margin-top: 24px;
      padding: 8px;
    }


    @media (max-width: 520px) {

      .app {
        padding: 14px 12px 40px;
      }

      .header {
        padding-bottom: 19px;
      }

      .logo {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        font-size: 24px;
      }

      .title {
        font-size: 24px;
      }

      .card {
        border-radius: 21px;
        padding: 15px;
      }

      #question {
        min-height: 145px;
        font-size: 16px;
      }

      #answer {
        font-size: 16px;
        line-height: 1.95;
      }

      .answer-actions {
        grid-template-columns: 1fr;
      }

      .math-block {
        padding: 12px 8px;
      }

      .step-item {
        padding: 13px 12px;
      }

      .final-answer-block {
        padding: 15px 12px;
      }

    }

  </style>


  <script>

    window.MathJax = {

      tex: {

        packages: {
          "[+]": ["ams"]
        },

        processEscapes: true

      },

      loader: {
        load: ["[tex]/ams"]
      },

      svg: {
        fontCache: "local",
        displayAlign: "center"
      },

      startup: {
        typeset: false
      }

    };

  </script>


  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"
  ></script>

</head>


<body>

  <main class="app">

    <header class="header">

      <div class="logo">
        1
      </div>

      <h1 class="title">
        ONE Study
      </h1>

      <p class="subtitle">
        مساعدك الدراسي بالذكاء الاصطناعي
        لشرح وحل الأسئلة بطريقة واضحة ومنظمة.
      </p>

    </header>


    <section class="card">

      <div class="section-title">
        اكتب سؤالك
      </div>

      <textarea
        id="question"
        placeholder="اكتب السؤال هنا، أو اختر صورة للسؤال..."
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      ></textarea>


      <div class="small-actions">

        <button
          type="button"
          class="small-btn"
          id="pasteBtn"
        >
          لصق
        </button>

        <button
          type="button"
          class="small-btn"
          id="clearBtn"
        >
          مسح
        </button>

      </div>


      <div class="image-area">

        <label
          class="image-picker"
          for="imageInput"
        >

          <div class="image-picker-icon">
            🖼️
          </div>

          <div class="image-picker-title">
            اختر صورة السؤال
          </div>

          <div class="image-picker-subtitle">
            يمكنك اختيار صورة من ألبوم الصور
          </div>

        </label>


        <input
          id="imageInput"
          type="file"
          accept="image/*"
        >


        <div id="imagePreviewArea">

          <div class="preview-card">

            <img
              id="imagePreview"
              alt="معاينة صورة السؤال"
            >

            <div class="preview-actions">

              <button
                type="button"
                class="small-btn"
                id="changeImageBtn"
              >
                تغيير الصورة
              </button>

              <button
                type="button"
                class="small-btn delete-btn"
                id="removeImageBtn"
              >
                حذف الصورة
              </button>

            </div>

          </div>

        </div>

      </div>


      <button
        type="button"
        class="solve-btn"
        id="solveBtn"
      >
        حل السؤال
      </button>


      <div
        id="status"
        role="status"
        aria-live="polite"
      ></div>

    </section>


    <section
      class="card"
      id="answerCard"
    >

      <div class="answer-header">

        <h2 class="answer-title">
          الإجابة
        </h2>

      </div>


      <div id="questionTypeBadge"></div>


      <div id="answer"></div>


      <div class="answer-actions">

        <button
          type="button"
          class="answer-action-btn"
          id="copyBtn"
        >
          نسخ الإجابة
        </button>

        <button
          type="button"
          class="answer-action-btn"
          id="saveBtn"
        >
          حفظ الإجابة
        </button>

        <button
          type="button"
          class="answer-action-btn"
          id="shareBtn"
        >
          مشاركة
        </button>

      </div>


      <div class="feedback">

        <div class="feedback-title">
          هل كانت الإجابة مفيدة؟
        </div>

        <div class="feedback-buttons">

          <button
            type="button"
            class="feedback-btn yes-btn"
            id="yesBtn"
          >
            نعم
          </button>

          <button
            type="button"
            class="feedback-btn no-btn"
            id="noBtn"
          >
            لا
          </button>

        </div>

      </div>

    </section>


    <footer class="footer">
      ONE Study
    </footer>

  </main>


  <script>

    /* ======================================================
       ELEMENTS
       ====================================================== */

    const questionInput =
      document.getElementById("question");

    const imageInput =
      document.getElementById("imageInput");

    const imagePreviewArea =
      document.getElementById("imagePreviewArea");

    const imagePreview =
      document.getElementById("imagePreview");

    const solveBtn =
      document.getElementById("solveBtn");

    const statusBox =
      document.getElementById("status");

    const answerCard =
      document.getElementById("answerCard");

    const answerElement =
      document.getElementById("answer");

    const questionTypeBadge =
      document.getElementById("questionTypeBadge");

    const pasteBtn =
      document.getElementById("pasteBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const changeImageBtn =
      document.getElementById("changeImageBtn");

    const removeImageBtn =
      document.getElementById("removeImageBtn");

    const copyBtn =
      document.getElementById("copyBtn");

    const saveBtn =
      document.getElementById("saveBtn");

    const shareBtn =
      document.getElementById("shareBtn");

    const yesBtn =
      document.getElementById("yesBtn");

    const noBtn =
      document.getElementById("noBtn");


    /* ======================================================
       STATE
       ====================================================== */

    let selectedImageDataURL =
      null;

    let currentBlocks =
      [];

    let currentQuestionTypeLabel =
      "";


    /* ======================================================
       STATUS
       ====================================================== */

    function showStatus(
      message,
      type = "loading"
    ) {

      statusBox.textContent =
        message;

      statusBox.className =
        type;

      statusBox.style.display =
        "block";

    }


    function hideStatus() {

      statusBox.textContent =
        "";

      statusBox.className =
        "";

      statusBox.style.display =
        "none";

    }


    /* ======================================================
       FILE TO DATA URL
       ====================================================== */

    async function fileToDataURL(file) {

      const buffer =
        await file.arrayBuffer();

      const bytes =
        new Uint8Array(buffer);

      const chunkSize =
        0x8000;

      let binary =
        "";


      for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
      ) {

        const chunk =
          bytes.subarray(
            i,
            i + chunkSize
          );

        binary +=
          String.fromCharCode.apply(
            null,
            chunk
          );

      }


      const base64 =
        btoa(binary);


      return (
        "data:" +
        file.type +
        ";base64," +
        base64
      );

    }


    /* ======================================================
       IMAGE
       ====================================================== */

    imageInput.addEventListener(
      "change",
      async function () {

        const file =
          imageInput.files &&
          imageInput.files[0];


        if (!file) {
          return;
        }


        if (
          !file.type ||
          !file.type.startsWith("image/")
        ) {

          showStatus(
            "يرجى اختيار ملف صورة صالح.",
            "error"
          );

          imageInput.value =
            "";

          return;

        }


        try {

          showStatus(
            "جاري تجهيز الصورة...",
            "loading"
          );


          selectedImageDataURL =
            await fileToDataURL(file);


          imagePreview.src =
            selectedImageDataURL;


          imagePreviewArea.style.display =
            "block";


          hideStatus();

        } catch (error) {

          console.error(
            "IMAGE ERROR:",
            error
          );


          selectedImageDataURL =
            null;

          imageInput.value =
            "";


          showStatus(
            "تعذر قراءة الصورة. حاول اختيارها مرة أخرى.",
            "error"
          );

        }

      }
    );


    changeImageBtn.addEventListener(
      "click",
      function () {

        imageInput.click();

      }
    );


    removeImageBtn.addEventListener(
      "click",
      function () {

        selectedImageDataURL =
          null;

        imageInput.value =
          "";

        imagePreview.removeAttribute(
          "src"
        );

        imagePreviewArea.style.display =
          "none";

      }
    );


    /* ======================================================
       PASTE
       ====================================================== */

    pasteBtn.addEventListener(
      "click",
      async function () {

        try {

          if (
            navigator.clipboard &&
            navigator.clipboard.readText
          ) {

            const text =
              await navigator.clipboard.readText();

            if (text) {

              questionInput.value =
                text;

              questionInput.focus();

            }

          } else {

            questionInput.focus();

          }

        } catch (error) {

          console.error(
            "PASTE ERROR:",
            error
          );

          questionInput.focus();

        }

      }
    );


    /* ======================================================
       CLEAR
       ====================================================== */

    clearBtn.addEventListener(
      "click",
      function () {

        questionInput.value =
          "";

        selectedImageDataURL =
          null;

        imageInput.value =
          "";

        imagePreview.removeAttribute(
          "src"
        );

        imagePreviewArea.style.display =
          "none";

        currentBlocks =
          [];

        currentQuestionTypeLabel =
          "";

        questionTypeBadge.textContent =
          "";

        questionTypeBadge.style.display =
          "none";

        answerElement.replaceChildren();

        answerCard.style.display =
          "none";

        hideStatus();

        questionInput.focus();

      }
    );


    /* ======================================================
       MATHJAX
       ====================================================== */

    async function waitForMathJax() {

      const maxAttempts =
        100;


      for (
        let attempt = 0;
        attempt < maxAttempts;
        attempt++
      ) {

        if (
          window.MathJax &&
          typeof window.MathJax.tex2svgPromise ===
            "function"
        ) {

          if (
            window.MathJax.startup &&
            window.MathJax.startup.promise
          ) {

            await window.MathJax.startup.promise;

          }

          return true;

        }


        await new Promise(
          (resolve) =>
            setTimeout(
              resolve,
              100
            )
        );

      }


      return false;

    }


    /* ======================================================
       INLINE MATH
       ====================================================== */

    function createInlineMath(tex) {

      const element =
        document.createElement("bdi");


      element.className =
        "inline-math";


      element.setAttribute(
        "dir",
        "ltr"
      );


      element.dataset.tex =
        tex.trim();


      element.dataset.display =
        "false";


      return element;

    }


    /* ======================================================
       PARAGRAPH
       Preserve spaces exactly
       ====================================================== */

    function createParagraphBlock(
      segments
    ) {

      const paragraph =
        document.createElement("div");


      paragraph.className =
        "answer-paragraph";


      if (
        !Array.isArray(segments)
      ) {

        return paragraph;

      }


      for (
        const segment of segments
      ) {

        if (
          !segment ||
          typeof segment.content !==
            "string"
        ) {

          continue;

        }


        if (
          segment.type === "text"
        ) {

          if (
            !segment.content.trim()
          ) {

            continue;

          }


          paragraph.appendChild(
            document.createTextNode(
              segment.content
            )
          );


          continue;

        }


        if (
          segment.type === "inline_math"
        ) {

          const tex =
            segment.content.trim();


          if (!tex) {
            continue;
          }


          paragraph.appendChild(
            createInlineMath(
              tex
            )
          );

        }

      }


      return paragraph;

    }


    /* ======================================================
       HEADING
       ====================================================== */

    function createHeadingBlock(
      content
    ) {

      const element =
        document.createElement("div");


      element.className =
        "answer-heading";


      element.textContent =
        content.trim();


      return element;

    }


    /* ======================================================
       DISPLAY MATH
       ====================================================== */

    function createMathBlock(tex) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "math-block";


      const content =
        document.createElement("div");


      content.className =
        "math-content";


      content.setAttribute(
        "dir",
        "ltr"
      );


      content.dataset.tex =
        tex.trim();


      content.dataset.display =
        "true";


      wrapper.appendChild(
        content
      );


      return wrapper;

    }


    /* ======================================================
       INNER BLOCK
       ====================================================== */

    function createInnerBlock(block) {

      if (
        !block ||
        typeof block !== "object"
      ) {

        return null;

      }


      if (
        block.type === "paragraph" &&
        Array.isArray(block.segments)
      ) {

        return createParagraphBlock(
          block.segments
        );

      }


      if (
        block.type === "math" &&
        typeof block.content ===
          "string" &&
        block.content.trim()
      ) {

        return createMathBlock(
          block.content
        );

      }


      return null;

    }


    /* ======================================================
       STEPS
       ====================================================== */

    function createStepsBlock(items) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "steps-block";


      if (
        !Array.isArray(items)
      ) {

        return wrapper;

      }


      let visibleNumber =
        0;


      for (
        const item of items
      ) {

        if (
          !item ||
          typeof item.title !==
            "string" ||
          !item.title.trim() ||
          !Array.isArray(
            item.blocks
          )
        ) {

          continue;

        }


        const innerElements =
          [];


        for (
          const block of item.blocks
        ) {

          const element =
            createInnerBlock(
              block
            );


          if (element) {

            innerElements.push(
              element
            );

          }

        }


        if (
          innerElements.length === 0
        ) {

          continue;

        }


        visibleNumber++;


        const itemElement =
          document.createElement("div");


        itemElement.className =
          "step-item";


        const header =
          document.createElement("div");


        header.className =
          "step-header";


        const number =
          document.createElement("div");


        number.className =
          "step-number";


        number.textContent =
          String(
            visibleNumber
          );


        const title =
          document.createElement("div");


        title.className =
          "step-title";


        title.textContent =
          item.title.trim();


        header.appendChild(
          number
        );


        header.appendChild(
          title
        );


        const content =
          document.createElement("div");


        content.className =
          "step-content";


        for (
          const element of innerElements
        ) {

          content.appendChild(
            element
          );

        }


        itemElement.appendChild(
          header
        );


        itemElement.appendChild(
          content
        );


        wrapper.appendChild(
          itemElement
        );

      }


      return wrapper;

    }


    /* ======================================================
       FINAL ANSWER
       ====================================================== */

    function createFinalAnswerBlock(
      blocks
    ) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "final-answer-block";


      const title =
        document.createElement("div");


      title.className =
        "final-answer-title";


      title.textContent =
        "النتيجة النهائية";


      const content =
        document.createElement("div");


      content.className =
        "final-answer-content";


      if (
        Array.isArray(blocks)
      ) {

        for (
          const block of blocks
        ) {

          const element =
            createInnerBlock(
              block
            );


          if (element) {

            content.appendChild(
              element
            );

          }

        }

      }


      wrapper.appendChild(
        title
      );


      wrapper.appendChild(
        content
      );


      return wrapper;

    }


    /* ======================================================
       NOTICE
       ====================================================== */

    function createNoticeBlock(
      segments
    ) {

      const wrapper =
        document.createElement("div");


      wrapper.className =
        "notice-block";


      const label =
        document.createElement("span");


      label.className =
        "notice-label";


      label.textContent =
        "ملاحظة";


      wrapper.appendChild(
        label
      );


      wrapper.appendChild(
        createParagraphBlock(
          segments
        )
      );


      return wrapper;

    }


    /* ======================================================
       ASSISTIVE MATH
       ====================================================== */

    function hideAssistiveMath(
      rendered
    ) {

      if (!rendered) {
        return;
      }


      rendered
        .querySelectorAll(
          "mjx-assistive-mml"
        )
        .forEach(
          (node) => {

            node.style.position =
              "absolute";

            node.style.width =
              "1px";

            node.style.height =
              "1px";

            node.style.padding =
              "0";

            node.style.margin =
              "-1px";

            node.style.overflow =
              "hidden";

            node.style.clip =
              "rect(0, 0, 0, 0)";

            node.style.clipPath =
              "inset(50%)";

            node.style.whiteSpace =
              "nowrap";

            node.style.border =
              "0";

          }
        );

    }


    /* ======================================================
       RENDER MATH
       ====================================================== */

    async function renderMathElement(
      element
    ) {

      const tex =
        element.dataset.tex;


      if (!tex) {
        return;
      }


      const isDisplay =
        element.dataset.display ===
        "true";


      try {

        const rendered =
          await window.MathJax.tex2svgPromise(
            tex,
            {
              display:
                isDisplay
            }
          );


        hideAssistiveMath(
          rendered
        );


        element.replaceChildren(
          rendered
        );

      } catch (error) {

        console.error(
          "MATHJAX RENDER ERROR:",
          error,
          tex
        );


        element.textContent =
          tex;

      }

    }


    /* ======================================================
       VALIDATE TOP LEVEL V3
       ====================================================== */

    function isValidBlock(block) {

      if (
        !block ||
        typeof block !== "object"
      ) {

        return false;

      }


      if (
        block.type === "heading" ||
        block.type === "math"
      ) {

        return (
          typeof block.content ===
            "string" &&
          Boolean(
            block.content.trim()
          )
        );

      }


      if (
        block.type === "paragraph" ||
        block.type === "notice"
      ) {

        return (
          Array.isArray(
            block.segments
          ) &&
          block.segments.length > 0
        );

      }


      if (
        block.type === "steps"
      ) {

        return (
          Array.isArray(
            block.items
          ) &&
          block.items.length > 0
        );

      }


      if (
        block.type ===
        "final_answer"
      ) {

        return (
          Array.isArray(
            block.blocks
          ) &&
          block.blocks.length > 0
        );

      }


      return false;

    }


    /* ======================================================
       RENDER V3
       ====================================================== */

    async function renderBlocks(
      blocks
    ) {

      answerElement.replaceChildren();


      if (
        !Array.isArray(blocks)
      ) {

        throw new Error(
          "صيغة الإجابة غير صحيحة."
        );

      }


      const validBlocks =
        blocks.filter(
          isValidBlock
        );


      if (
        validBlocks.length === 0
      ) {

        throw new Error(
          "لم تصل إجابة قابلة للعرض."
        );

      }


      const fragment =
        document.createDocumentFragment();


      for (
        const block of validBlocks
      ) {

        let element =
          null;


        if (
          block.type === "heading"
        ) {

          element =
            createHeadingBlock(
              block.content
            );

        }


        else if (
          block.type === "paragraph"
        ) {

          element =
            createParagraphBlock(
              block.segments
            );

        }


        else if (
          block.type === "math"
        ) {

          element =
            createMathBlock(
              block.content
            );

        }


        else if (
          block.type === "steps"
        ) {

          element =
            createStepsBlock(
              block.items
            );

        }


        else if (
          block.type ===
          "final_answer"
        ) {

          element =
            createFinalAnswerBlock(
              block.blocks
            );

        }


        else if (
          block.type === "notice"
        ) {

          element =
            createNoticeBlock(
              block.segments
            );

        }


        if (element) {

          fragment.appendChild(
            element
          );

        }

      }


      answerElement.appendChild(
        fragment
      );


      const mathElements =
        answerElement.querySelectorAll(
          ".math-content, .inline-math"
        );


      if (
        mathElements.length === 0
      ) {

        return;

      }


      const ready =
        await waitForMathJax();


      if (!ready) {

        mathElements.forEach(
          (element) => {

            element.textContent =
              element.dataset.tex ||
              "";

          }
        );

        return;

      }


      for (
        const element of mathElements
      ) {

        await renderMathElement(
          element
        );

      }

    }


    /* ======================================================
       ASK
       ====================================================== */

    async function askAI() {

      const question =
        questionInput.value.trim();


      if (
        !question &&
        !selectedImageDataURL
      ) {

        showStatus(
          "اكتب سؤالاً أو اختر صورة أولاً.",
          "error"
        );

        return;

      }


      solveBtn.disabled =
        true;


      solveBtn.textContent =
        "جاري الحل...";


      answerCard.style.display =
        "none";


      answerElement.replaceChildren();


      questionTypeBadge.style.display =
        "none";


      currentBlocks =
        [];


      currentQuestionTypeLabel =
        "";


      showStatus(
        "جاري قراءة السؤال وإعداد الحل...",
        "loading"
      );


      try {

        const response =
          await fetch(
            "/ask",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  question:
                    question,

                  image:
                    selectedImageDataURL

                })

            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch (error) {

          throw new Error(
            "وصل رد غير صالح من الخادم."
          );

        }


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "حدث خطأ أثناء معالجة السؤال."
          );

        }


        if (
          data.version !== 3
        ) {

          console.warn(
            "Unexpected response version:",
            data.version
          );

        }


        if (
          !Array.isArray(
            data.blocks
          )
        ) {

          throw new Error(
            "الخادم لم يرسل Structured Blocks V3 بالصورة المتوقعة."
          );

        }


        currentBlocks =
          data.blocks;


        currentQuestionTypeLabel =
          typeof data.question_type_label ===
            "string"
            ? data.question_type_label.trim()
            : "";


        if (
          currentQuestionTypeLabel
        ) {

          questionTypeBadge.textContent =
            currentQuestionTypeLabel;


          questionTypeBadge.style.display =
            "block";

        }


        await renderBlocks(
          currentBlocks
        );


        hideStatus();


        answerCard.style.display =
          "block";


        setTimeout(
          function () {

            answerCard.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          },
          100
        );

      } catch (error) {

        console.error(
          "ASK ERROR:",
          error
        );


        showStatus(
          error?.message ||
          "تعذر الحصول على الإجابة.",
          "error"
        );

      } finally {

        solveBtn.disabled =
          false;


        solveBtn.textContent =
          "حل السؤال";

      }

    }


    solveBtn.addEventListener(
      "click",
      askAI
    );


    /* ======================================================
       SEGMENTS TO TEXT
       ====================================================== */

    function segmentsToPlainText(
      segments
    ) {

      if (
        !Array.isArray(segments)
      ) {

        return "";

      }


      let result =
        "";


      for (
        const segment of segments
      ) {

        if (
          !segment ||
          typeof segment.content !==
            "string"
        ) {

          continue;

        }


        if (
          segment.type === "text"
        ) {

          result +=
            segment.content;

        }


        else if (
          segment.type ===
          "inline_math"
        ) {

          result +=
            segment.content.trim();

        }

      }


      return result.trim();

    }


    /* ======================================================
       INNER BLOCKS TO TEXT
       ====================================================== */

    function innerBlocksToPlainText(
      blocks
    ) {

      if (
        !Array.isArray(blocks)
      ) {

        return "";

      }


      const parts =
        [];


      for (
        const block of blocks
      ) {

        if (!block) {
          continue;
        }


        if (
          block.type === "paragraph"
        ) {

          const text =
            segmentsToPlainText(
              block.segments
            );


          if (text) {

            parts.push(
              text
            );

          }

        }


        else if (
          block.type === "math" &&
          typeof block.content ===
            "string"
        ) {

          const text =
            block.content.trim();


          if (text) {

            parts.push(
              text
            );

          }

        }

      }


      return parts
        .join("\n")
        .trim();

    }


    /* ======================================================
       V3 TO PLAIN TEXT
       ====================================================== */

    function blocksToPlainText() {

      if (
        !Array.isArray(
          currentBlocks
        )
      ) {

        return "";

      }


      const parts =
        [];


      for (
        const block of currentBlocks
      ) {

        if (!block) {
          continue;
        }


        if (
          block.type === "heading" &&
          typeof block.content ===
            "string"
        ) {

          const text =
            block.content.trim();


          if (text) {
            parts.push(text);
          }


          continue;

        }


        if (
          block.type === "paragraph"
        ) {

          const text =
            segmentsToPlainText(
              block.segments
            );


          if (text) {
            parts.push(text);
          }


          continue;

        }


        if (
          block.type === "math" &&
          typeof block.content ===
            "string"
        ) {

          const text =
            block.content.trim();


          if (text) {
            parts.push(text);
          }


          continue;

        }


        if (
          block.type === "steps" &&
          Array.isArray(block.items)
        ) {

          const stepParts =
            [];


          let number =
            0;


          for (
            const item of block.items
          ) {

            if (!item) {
              continue;
            }


            const content =
              innerBlocksToPlainText(
                item.blocks
              );


            if (!content) {
              continue;
            }


            number++;


            const title =
              typeof item.title ===
                "string"
                ? item.title.trim()
                : "";


            stepParts.push(
              number +
              ". " +
              title +
              "\n" +
              content
            );

          }


          if (
            stepParts.length
          ) {

            parts.push(
              stepParts.join(
                "\n\n"
              )
            );

          }


          continue;

        }


        if (
          block.type ===
            "final_answer"
        ) {

          const content =
            innerBlocksToPlainText(
              block.blocks
            );


          if (content) {

            parts.push(
              "النتيجة النهائية\n" +
              content
            );

          }


          continue;

        }


        if (
          block.type === "notice"
        ) {

          const content =
            segmentsToPlainText(
              block.segments
            );


          if (content) {

            parts.push(
              "ملاحظة\n" +
              content
            );

          }

        }

      }


      return parts
        .join("\n\n")
        .trim();

    }


    /* ======================================================
       COPY
       ====================================================== */

    copyBtn.addEventListener(
      "click",
      async function () {

        const text =
          blocksToPlainText();


        if (!text) {
          return;
        }


        try {

          if (
            navigator.clipboard &&
            navigator.clipboard.writeText
          ) {

            await navigator.clipboard.writeText(
              text
            );


            showStatus(
              "تم نسخ الإجابة.",
              "success"
            );


            setTimeout(
              hideStatus,
              1800
            );

          } else {

            throw new Error(
              "Clipboard unavailable"
            );

          }

        } catch (error) {

          const textarea =
            document.createElement(
              "textarea"
            );


          textarea.value =
            text;


          textarea.style.position =
            "fixed";


          textarea.style.opacity =
            "0";


          document.body.appendChild(
            textarea
          );


          textarea.focus();
          textarea.select();


          try {

            document.execCommand(
              "copy"
            );


            showStatus(
              "تم نسخ الإجابة.",
              "success"
            );


            setTimeout(
              hideStatus,
              1800
            );

          } catch (fallbackError) {

            showStatus(
              "تعذر نسخ الإجابة تلقائياً.",
              "error"
            );

          }


          textarea.remove();

        }

      }
    );


    /* ======================================================
       SAVE
       ====================================================== */

    saveBtn.addEventListener(
      "click",
      function () {

        const text =
          blocksToPlainText();


        if (!text) {
          return;
        }


        try {

          const blob =
            new Blob(
              [text],
              {
                type:
                  "text/plain;charset=utf-8"
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;


          link.download =
            "ONE-Study-answer.txt";


          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          setTimeout(
            function () {

              URL.revokeObjectURL(
                url
              );

            },
            1000
          );


          showStatus(
            "تم تجهيز الإجابة للحفظ.",
            "success"
          );


          setTimeout(
            hideStatus,
            1800
          );

        } catch (error) {

          console.error(
            "SAVE ERROR:",
            error
          );


          showStatus(
            "تعذر حفظ الإجابة.",
            "error"
          );

        }

      }
    );


    /* ======================================================
       SHARE
       ====================================================== */

    shareBtn.addEventListener(
      "click",
      async function () {

        const text =
          blocksToPlainText();


        if (!text) {
          return;
        }


        try {

          if (
            navigator.share
          ) {

            await navigator.share({

              title:
                "ONE Study",

              text:
                text

            });

          }


          else if (
            navigator.clipboard &&
            navigator.clipboard.writeText
          ) {

            await navigator.clipboard.writeText(
              text
            );


            showStatus(
              "المشاركة غير متاحة هنا، لذلك تم نسخ الإجابة.",
              "success"
            );


            setTimeout(
              hideStatus,
              2200
            );

          }


          else {

            showStatus(
              "المشاركة غير متاحة في هذا المتصفح.",
              "error"
            );

          }

        } catch (error) {

          if (
            error &&
            error.name ===
              "AbortError"
          ) {

            return;

          }


          console.error(
            "SHARE ERROR:",
            error
          );

        }

      }
    );


    /* ======================================================
       FEEDBACK
       ====================================================== */

    yesBtn.addEventListener(
      "click",
      function () {

        showStatus(
          "شكراً لتقييمك.",
          "success"
        );


        setTimeout(
          hideStatus,
          1800
        );

      }
    );


    noBtn.addEventListener(
      "click",
      function () {

        showStatus(
          "شكراً لملاحظتك. سنحاول تقديم إجابة أوضح.",
          "success"
        );


        setTimeout(
          hideStatus,
          2200
        );

      }
    );


    /* ======================================================
       INITIAL
       ====================================================== */

    hideStatus();

  </script>
