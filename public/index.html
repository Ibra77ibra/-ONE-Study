<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ONE Study</title>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: [
          "script",
          "noscript",
          "style",
          "textarea",
          "pre",
          "code"
        ]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 42px 20px 58px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      opacity: 0.92;
    }

    .container {
      max-width: 700px;
      margin: -32px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 18px;
      font-size: 23px;
      text-align: right;
    }

    textarea {
      width: 100%;
      min-height: 155px;
      border: 1px solid #dbe2ea;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      direction: rtl;
      text-align: right;
      background: white;
      color: #172033;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .question-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .tool-button {
      margin: 0;
      padding: 13px 10px;
      border-radius: 13px;
      font-size: 15px;
      background: #eef2ff;
      color: #1e40af;
      border: 1px solid #dbeafe;
    }

    .attachment-section {
      margin-top: 18px;
      display: grid;
      gap: 14px;
    }

    .attachment-box {
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 18px;
      background: #f8fafc;
      text-align: center;
    }

    .attachment-title {
      font-size: 17px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .picker-button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: #e8efff;
      color: #1d4ed8;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .preview-card {
      display: none;
      margin-top: 14px;
    }

    #preview {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 14px;
      background: white;
      border: 1px solid #e2e8f0;
    }

    .preview-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .small-button {
      margin: 0;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
    }

    .change-button {
      background: #2563eb;
    }

    .remove-button {
      background: #e11d48;
    }

    .file-card {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: white;
      border: 1px solid #e2e8f0;
      text-align: right;
    }

    .file-name {
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .file-details {
      margin-top: 5px;
      color: #64748b;
      font-size: 13px;
    }

    #askButton {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 16px;
      padding: 17px;
      font-size: 20px;
      font-weight: 750;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    #askButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 22px 10px;
      color: #475569;
      font-size: 17px;
      font-weight: 650;
    }

    .answer {
      display: none;
      margin-top: 20px;
      background: #eef4ff;
      border: 1px solid #dbeafe;
      border-radius: 18px;
      padding: 22px;
      font-size: 18px;
      line-height: 2;
      direction: rtl;
      text-align: right;
      overflow-wrap: break-word;
    }

    .answer.error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;
      white-space: pre-wrap;
    }

    .answer-line {
      direction: rtl;
      text-align: right;
      margin-bottom: 7px;
    }

    .display-math {
      direction: ltr;
      unicode-bidi: isolate;
      text-align: center;
      overflow-x: auto;
      padding: 7px 2px;
      margin: 10px 0;
    }

    .inline-math {
      display: inline-block;
      direction: ltr;
      unicode-bidi: isolate;
      margin: 0 2px;
    }

    .answer mjx-container {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      max-width: 100%;
    }

    .answer-actions {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .answer-action-button {
      margin: 0;
      padding: 13px 7px;
      font-size: 14px;
      border-radius: 13px;
    }

    #copyAnswerButton {
      background: #0f766e;
    }

    #saveAnswerButton {
      background: #7c3aed;
    }

    #shareAnswerButton {
      background: #0369a1;
    }

    .feedback {
      display: none;
      margin-top: 16px;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 15px;
      background: #f8fafc;
      text-align: center;
    }

    .feedback-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .feedback-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .yes-button {
      background: #15803d;
    }

    .no-button {
      background: #be123c;
    }

    .feedback-message {
      display: none;
      margin-top: 9px;
      color: #475569;
      font-size: 14px;
    }

    .note {
      font-size: 14px;
      color: #64748b;
      margin-top: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header {
        padding: 38px 16px 55px;
      }

      .logo {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }

      .answer {
        padding: 18px 16px;
        font-size: 17px;
      }

      .answer-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">ONE Study</div>
    <div class="subtitle">مساعدك الدراسي بالذكاء الاصطناعي</div>
  </div>

  <div class="container">
    <div class="card">

      <h2>ما السؤال الذي تريد حله؟</h2>

      <textarea
        id="question"
        placeholder="اكتب السؤال هنا أو الصقه..."
      ></textarea>

      <div class="question-tools">

        <button
          id="pasteButton"
          class="tool-button"
          type="button"
        >
          📋 لصق
        </button>

        <button
          id="clearQuestionButton"
          class="tool-button"
          type="button"
        >
          ✖ مسح السؤال
        </button>

      </div>

      <div class="attachment-section">

        <!-- IMAGE -->

        <div class="attachment-box">

          <div class="attachment-title">
            🖼️ صورة السؤال
          </div>

          <input
            id="imageInput"
            class="hidden-input"
            type="file"
            accept="image/*"
          >

          <label
            for="imageInput"
            class="picker-button"
          >
            اختيار صورة من الاستديو
          </label>

          <div
            id="imagePreviewCard"
            class="preview-card"
          >

            <img
              id="preview"
              alt="معاينة صورة السؤال"
            >

            <div class="preview-actions">

              <button
                id="changeImageButton"
                class="small-button change-button"
                type="button"
              >
                🔄 تغيير
              </button>

              <button
                id="removeImageButton"
                class="small-button remove-button"
                type="button"
              >
                🗑️ حذف
              </button>

            </div>

          </div>

        </div>


        <!-- FILE -->

        <div class="attachment-box">

          <div class="attachment-title">
            📎 إرفاق ملف
          </div>

          <input
            id="fileInput"
            class="hidden-input"
            type="file"
            accept=".pdf,.txt,.doc,.docx,.ppt,.pptx,.rtf"
          >

          <label
            for="fileInput"
            class="picker-button"
          >
            اختيار ملف من الجهاز
          </label>

          <div
            id="fileCard"
            class="file-card"
          >

            <div
              id="fileName"
              class="file-name"
            ></div>

            <div
              id="fileDetails"
              class="file-details"
            ></div>

            <div class="preview-actions">

              <button
                id="changeFileButton"
                class="small-button change-button"
                type="button"
              >
                🔄 تغيير
              </button>

              <button
                id="removeFileButton"
                class="small-button remove-button"
                type="button"
              >
                🗑️ حذف
              </button>

            </div>

          </div>

        </div>

      </div>


      <button
        id="askButton"
        type="button"
      >
        حل السؤال
      </button>


      <div
        id="loading"
        class="loading"
      >
        جاري تحليل السؤال...
      </div>


      <div
        id="answer"
        class="answer"
      ></div>


      <div
        id="answerActions"
        class="answer-actions"
      >

        <button
          id="copyAnswerButton"
          class="answer-action-button"
          type="button"
        >
          📋 نسخ الإجابة
        </button>

        <button
          id="saveAnswerButton"
          class="answer-action-button"
          type="button"
        >
          💾 حفظ الإجابة
        </button>

        <button
          id="shareAnswerButton"
          class="answer-action-button"
          type="button"
        >
          📤 مشاركة
        </button>

      </div>


      <div
        id="feedback"
        class="feedback"
      >

        <div class="feedback-title">
          هل كانت الإجابة مفيدة؟
        </div>

        <div class="feedback-actions">

          <button
            id="yesButton"
            class="small-button yes-button"
            type="button"
          >
            👍 نعم
          </button>

          <button
            id="noButton"
            class="small-button no-button"
            type="button"
          >
            👎 لا
          </button>

        </div>

        <div
          id="feedbackMessage"
          class="feedback-message"
        ></div>

      </div>


      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>

    </div>
  </div>


<script>

(function () {

  "use strict";

  var API_URL = "/ask";

  var questionInput =
    document.getElementById("question");

  var pasteButton =
    document.getElementById("pasteButton");

  var clearQuestionButton =
    document.getElementById("clearQuestionButton");

  var imageInput =
    document.getElementById("imageInput");

  var imagePreviewCard =
    document.getElementById("imagePreviewCard");

  var preview =
    document.getElementById("preview");

  var changeImageButton =
    document.getElementById("changeImageButton");

  var removeImageButton =
    document.getElementById("removeImageButton");

  var fileInput =
    document.getElementById("fileInput");

  var fileCard =
    document.getElementById("fileCard");

  var fileName =
    document.getElementById("fileName");

  var fileDetails =
    document.getElementById("fileDetails");

  var changeFileButton =
    document.getElementById("changeFileButton");

  var removeFileButton =
    document.getElementById("removeFileButton");

  var askButton =
    document.getElementById("askButton");

  var loading =
    document.getElementById("loading");

  var answer =
    document.getElementById("answer");

  var answerActions =
    document.getElementById("answerActions");

  var copyAnswerButton =
    document.getElementById("copyAnswerButton");

  var saveAnswerButton =
    document.getElementById("saveAnswerButton");

  var shareAnswerButton =
    document.getElementById("shareAnswerButton");

  var feedback =
    document.getElementById("feedback");

  var yesButton =
    document.getElementById("yesButton");

  var noButton =
    document.getElementById("noButton");

  var feedbackMessage =
    document.getElementById("feedbackMessage");

  var currentAnswerText = "";


  /* =========================
     FILE HELPERS
     ========================= */

  async function fileToDataURL(file) {

    var buffer =
      await file.arrayBuffer();

    var bytes =
      new Uint8Array(buffer);

    var binary = "";

    var chunkSize =
      0x8000;

    for (
      var i = 0;
      i < bytes.length;
      i += chunkSize
    ) {

      var chunk =
        bytes.subarray(
          i,
          Math.min(
            i + chunkSize,
            bytes.length
          )
        );

      binary +=
        String.fromCharCode.apply(
          null,
          chunk
        );

    }

    var base64 =
      btoa(binary);

    var mime =
      file.type ||
      "application/octet-stream";

    return (
      "data:" +
      mime +
      ";base64," +
      base64
    );

  }


  async function fileToBase64(file) {

    var dataURL =
      await fileToDataURL(file);

    var commaIndex =
      dataURL.indexOf(",");

    return dataURL.slice(
      commaIndex + 1
    );

  }


  function formatBytes(bytes) {

    if (bytes < 1024) {
      return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
      return (
        bytes / 1024
      ).toFixed(1) + " KB";
    }

    return (
      bytes /
      (1024 * 1024)
    ).toFixed(1) + " MB";

  }


  /* =========================
     PASTE
     ========================= */

  pasteButton.addEventListener(
    "click",
    async function () {

      try {

        if (
          navigator.clipboard &&
          navigator.clipboard.readText
        ) {

          var text =
            await navigator.clipboard
              .readText();

          if (text) {

            questionInput.value =
              text;

            questionInput.focus();

            return;

          }

        }

        alert(
          "اضغط مطولاً داخل مربع السؤال ثم اختر «لصق»."
        );

        questionInput.focus();

      } catch (error) {

        alert(
          "اسمح بالوصول للحافظة أو استخدم الضغط المطول ثم «لصق»."
        );

        questionInput.focus();

      }

    }
  );


  clearQuestionButton.addEventListener(
    "click",
    function () {

      questionInput.value =
        "";

      questionInput.focus();

    }
  );


  /* =========================
     IMAGE
     ========================= */

  imageInput.addEventListener(
    "change",
    function () {

      var file =
        imageInput.files &&
        imageInput.files.length

          ? imageInput.files[0]
          : null;

      if (!file) {
        return;
      }

      if (
        file.type &&
        !file.type.startsWith("image/")
      ) {

        imageInput.value =
          "";

        alert(
          "اختر ملف صورة فقط."
        );

        return;

      }

      var maxImageSize =
        10 * 1024 * 1024;

      if (
        file.size >
        maxImageSize
      ) {

        imageInput.value =
          "";

        alert(
          "الصورة أكبر من 10 MB."
        );

        return;

      }

      var url =
        URL.createObjectURL(file);

      preview.onload =
        function () {

          URL.revokeObjectURL(url);

        };

      preview.src =
        url;

      imagePreviewCard.style.display =
        "block";

    }
  );


  changeImageButton.addEventListener(
    "click",
    function () {

      imageInput.click();

    }
  );


  removeImageButton.addEventListener(
    "click",
    function () {

      imageInput.value =
        "";

      preview.removeAttribute("src");

      imagePreviewCard.style.display =
        "none";

    }
  );


  /* =========================
     FILE
     ========================= */

  fileInput.addEventListener(
    "change",
    function () {

      var file =
        fileInput.files &&
        fileInput.files.length

          ? fileInput.files[0]
          : null;

      if (!file) {
        return;
      }

      var maxFileSize =
        8 * 1024 * 1024;

      if (
        file.size >
        maxFileSize
      ) {

        fileInput.value =
          "";

        alert(
          "حجم الملف كبير. الحد الحالي 8 MB."
        );

        return;

      }

      fileName.textContent =
        "📄 " + file.name;

      fileDetails.textContent =
        formatBytes(file.size) +
        (
          file.type
            ? " • " + file.type
            : ""
        );

      fileCard.style.display =
        "block";

    }
  );


  changeFileButton.addEventListener(
    "click",
    function () {

      fileInput.click();

    }
  );


  removeFileButton.addEventListener(
    "click",
    function () {

      fileInput.value =
        "";

      fileName.textContent =
        "";

      fileDetails.textContent =
        "";

      fileCard.style.display =
        "none";

    }
  );


  /* =========================
     ANSWER FORMAT
     ========================= */

  function normalizeResponse(text) {

    var source =
      String(text || "");

    source =
      source
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");

    source =
      source.replace(
        /\$?begin:math:display\$?/gi,
        "\\["
      );

    source =
      source.replace(
        /\$?end:math:display\$?/gi,
        "\\]"
      );

    source =
      source.replace(
        /\$?begin:math:inline\$?/gi,
        "\\("
      );

    source =
      source.replace(
        /\$?end:math:inline\$?/gi,
        "\\)"
      );

    source =
      source.replace(
        /\$?begin:math:text\$?/gi,
        "\\("
      );

    source =
      source.replace(
        /\$?end:math:text\$?/gi,
        "\\)"
      );

    source =
      source.replace(
        /\$\$([\s\S]*?)\$\$/g,
        function (_, math) {

          return (
            "\\[" +
            math.trim() +
            "\\]"
          );

        }
      );

    source =
      source.replace(
        /\$([^$\n]+?)\$/g,
        function (_, math) {

          return (
            "\\(" +
            math.trim() +
            "\\)"
          );

        }
      );

    return source;

  }


  function createDisplayMath(math) {

    var div =
      document.createElement("div");

    div.className =
      "display-math";

    div.setAttribute(
      "dir",
      "ltr"
    );

    div.textContent =
      "\\[" +
      math.trim() +
      "\\]";

    return div;

  }


  function appendInlineContent(
    container,
    line
  ) {

    var regex =
      /\\\(([\s\S]*?)\\\)/g;

    var lastIndex =
      0;

    var match;

    while (
      (
        match =
          regex.exec(line)
      ) !== null
    ) {

      var before =
        line.slice(
          lastIndex,
          match.index
        );

      if (before) {

        container.appendChild(
          document.createTextNode(
            before
          )
        );

      }

      var span =
        document.createElement(
          "span"
        );

      span.className =
        "inline-math";

      span.setAttribute(
        "dir",
        "ltr"
      );

      span.textContent =
        "\\(" +
        match[1].trim() +
        "\\)";

      container.appendChild(
        span
      );

      lastIndex =
        regex.lastIndex;

    }

    var remaining =
      line.slice(lastIndex);

    if (remaining) {

      container.appendChild(
        document.createTextNode(
          remaining
        )
      );

    }

  }


  function appendTextBlock(text) {

    String(text)
      .split("\n")
      .forEach(
        function (line) {

          if (!line.trim()) {

            var spacer =
              document.createElement(
                "div"
              );

            spacer.style.height =
              "8px";

            answer.appendChild(
              spacer
            );

            return;

          }

          var div =
            document.createElement(
              "div"
            );

          div.className =
            "answer-line";

          div.setAttribute(
            "dir",
            "rtl"
          );

          appendInlineContent(
            div,
            line
          );

          answer.appendChild(div);

        }
      );

  }


  function parseAnswer(text) {

    answer.innerHTML =
      "";

    var source =
      normalizeResponse(text);

    var regex =
      /\\\[([\s\S]*?)\\\]/g;

    var lastIndex =
      0;

    var match;

    while (
      (
        match =
          regex.exec(source)
      ) !== null
    ) {

      appendTextBlock(
        source.slice(
          lastIndex,
          match.index
        )
      );

      answer.appendChild(
        createDisplayMath(
          match[1]
        )
      );

      lastIndex =
        regex.lastIndex;

    }

    appendTextBlock(
      source.slice(lastIndex)
    );

  }


  async function renderMath() {

    try {

      if (
        window.MathJax &&
        window.MathJax.typesetPromise
      ) {

        if (
          window.MathJax.typesetClear
        ) {

          window.MathJax
            .typesetClear([answer]);

        }

        await window.MathJax
          .typesetPromise([answer]);

      }

    } catch (error) {

      console.error(
        "MathJax:",
        error
      );

    }

  }


  async function showAnswer(text) {

    currentAnswerText =
      String(text || "");

    answer.classList.remove(
      "error"
    );

    parseAnswer(
      currentAnswerText
    );

    answer.style.display =
      "block";

    answerActions.style.display =
      "grid";

    feedback.style.display =
      "block";

    feedbackMessage.style.display =
      "none";

    await renderMath();

    try {

      answer.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    } catch (error) {

      answer.scrollIntoView();

    }

  }


  function showError(message) {

    currentAnswerText =
      "";

    answer.classList.add(
      "error"
    );

    answer.textContent =
      "تعذر الحصول على الإجابة:\n" +
      message;

    answer.style.display =
      "block";

    answerActions.style.display =
      "none";

    feedback.style.display =
      "none";

  }


  /* =========================
     COPY
     ========================= */

  async function copyText(text) {

    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      await navigator.clipboard
        .writeText(text);

      return;

    }

    var temp =
      document.createElement(
        "textarea"
      );

    temp.value =
      text;

    temp.style.position =
      "fixed";

    temp.style.opacity =
      "0";

    document.body.appendChild(
      temp
    );

    temp.select();

    document.execCommand(
      "copy"
    );

    temp.remove();

  }


  copyAnswerButton.addEventListener(
    "click",
    async function () {

      if (!currentAnswerText) {
        return;
      }

      try {

        await copyText(
          currentAnswerText
        );

        var original =
          copyAnswerButton.textContent;

        copyAnswerButton.textContent =
          "✓ تم النسخ";

        setTimeout(
          function () {

            copyAnswerButton.textContent =
              original;

          },
          1500
        );

      } catch (error) {

        alert(
          "تعذر النسخ تلقائياً."
        );

      }

    }
  );


  /* =========================
     SAVE
     ========================= */

  saveAnswerButton.addEventListener(
    "click",
    function () {

      if (!currentAnswerText) {
        return;
      }

      var content =
        "ONE Study\n\n" +
        currentAnswerText +
        "\n";

      var blob =
        new Blob(
          [content],
          {
            type:
              "text/plain;charset=utf-8"
          }
        );

      var url =
        URL.createObjectURL(blob);

      var link =
        document.createElement("a");

      link.href =
        url;

      link.download =
        "ONE-Study-Answer.txt";

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      setTimeout(
        function () {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );

    }
  );


  /* =========================
     SHARE
     ========================= */

  shareAnswerButton.addEventListener(
    "click",
    async function () {

      if (!currentAnswerText) {
        return;
      }

      try {

        if (navigator.share) {

          await navigator.share({
            title:
              "إجابة ONE Study",

            text:
              currentAnswerText
          });

        } else {

          await copyText(
            currentAnswerText
          );

          alert(
            "المشاركة غير مدعومة هنا، لذلك تم نسخ الإجابة."
          );

        }

      } catch (error) {

        if (
          error &&
          error.name ===
            "AbortError"
        ) {

          return;

        }

        console.error(
          "Share:",
          error
        );

      }

    }
  );


  /* =========================
     YES / NO
     ========================= */

  function setFeedback(text) {

    feedbackMessage.textContent =
      text;

    feedbackMessage.style.display =
      "block";

  }


  yesButton.addEventListener(
    "click",
    function () {

      setFeedback(
        "شكراً، تم تسجيل اختيارك: نعم ✓"
      );

    }
  );


  noButton.addEventListener(
    "click",
    function () {

      setFeedback(
        "تم تسجيل اختيارك: لا. يمكنك تعديل السؤال وإعادة المحاولة."
      );

    }
  );


  /* =========================
     ASK
     ========================= */

  async function askAI() {

    var question =
      questionInput.value.trim();

    var imageFile =
      imageInput.files &&
      imageInput.files.length

        ? imageInput.files[0]
        : null;

    var attachedFile =
      fileInput.files &&
      fileInput.files.length

        ? fileInput.files[0]
        : null;

    if (
      !question &&
      !imageFile &&
      !attachedFile
    ) {

      alert(
        "اكتب سؤالاً أو اختر صورة أو أرفق ملفاً."
      );

      return;

    }

    askButton.disabled =
      true;

    answer.style.display =
      "none";

    answerActions.style.display =
      "none";

    feedback.style.display =
      "none";

    loading.style.display =
      "block";

    loading.textContent =
      "جاري تجهيز الطلب...";

    try {

      var imageData =
        null;

      var fileData =
        null;

      if (imageFile) {

        loading.textContent =
          "جاري تجهيز الصورة...";

        imageData =
          await fileToDataURL(
            imageFile
          );

      }

      if (attachedFile) {

        loading.textContent =
          "جاري تجهيز الملف...";

        fileData = {
          name:
            attachedFile.name,

          type:
            attachedFile.type ||
            "application/octet-stream",

          data:
            await fileToBase64(
              attachedFile
            )
        };

      }

      loading.textContent =
        "جاري تحليل السؤال...";

      var response =
        await fetch(
          API_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                question:
                  question,

                image:
                  imageData,

                file:
                  fileData
              })
          }
        );

      var responseText =
        await response.text();

      var data;

      try {

        data =
          JSON.parse(
            responseText
          );

      } catch (error) {

        throw new Error(
          "الخادم أعاد استجابة غير صالحة."
        );

      }

      if (!response.ok) {

        throw new Error(
          data.error ||
          "حدث خطأ أثناء معالجة الطلب."
        );

      }

      var finalAnswer =
        data.answer ||
        data.output ||
        data.response;

      if (!finalAnswer) {

        throw new Error(
          "لم تصل إجابة من الخادم."
        );

      }

      await showAnswer(
        finalAnswer
      );

    } catch (error) {

      console.error(
        "ONE STUDY ERROR:",
        error
      );

      showError(
        error &&
        error.message

          ? error.message
          : "حدث خطأ غير معروف."
      );

    } finally {

      loading.style.display =
        "none";

      loading.textContent =
        "جاري تحليل السؤال...";

      askButton.disabled =
        false;

    }

  }


  askButton.addEventListener(
    "click",
    askAI
  );

})();

</script>

</body>
</html>
