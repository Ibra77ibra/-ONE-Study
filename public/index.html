<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ONE Study</title>


  <!-- =========================
       MATHJAX SETTINGS
       ========================= -->

  <script>

    window.MathJax = {

      tex: {

        inlineMath: [
          ["\\(", "\\)"]
        ],

        displayMath: [
          ["\\[", "\\]"]
        ],

        processEscapes: true
      },

      options: {

        skipHtmlTags: [
          "script",
          "noscript",
          "style",
          "textarea",
          "pre",
          "code"
        ]

      },

      chtml: {
        scale: 1
      }

    };

  </script>


  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>



  <style>

    /* =========================
       GENERAL
       ========================= */

    * {
      box-sizing: border-box;
    }


    html {
      -webkit-text-size-adjust: 100%;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f7fb;

      color: #172033;

    }


    /* =========================
       HEADER
       ========================= */

    .header {

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      padding:
        42px 20px 58px;

      text-align: center;

    }


    .logo {

      font-size: 38px;

      font-weight: 800;

      margin-bottom: 8px;

    }


    .subtitle {

      font-size: 17px;

      opacity: 0.9;

    }


    /* =========================
       CONTAINER
       ========================= */

    .container {

      max-width: 700px;

      margin:
        -32px auto 40px;

      padding:
        0 16px;

    }


    .card {

      background: white;

      border-radius: 24px;

      padding: 24px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.08);

    }


    h2 {

      margin:
        0 0 20px;

      font-size: 23px;

      text-align: right;

    }


    /* =========================
       QUESTION
       ========================= */

    textarea {

      width: 100%;

      min-height: 155px;

      border:
        1px solid #dbe2ea;

      border-radius: 16px;

      padding: 16px;

      font-size: 17px;

      resize: vertical;

      outline: none;

      font-family: inherit;

      direction: rtl;

      text-align: right;

    }


    textarea:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.08);

    }


    /* =========================
       IMAGE
       ========================= */

    .image-box {

      margin-top: 17px;

      border:
        2px dashed #cbd5e1;

      border-radius: 16px;

      padding: 20px;

      text-align: center;

      background: #f8fafc;

    }


    .image-title {

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 14px;

    }


    input[type="file"] {

      width: 100%;

      font-size: 15px;

    }


    #preview {

      display: none;

      width: 100%;

      max-height: 400px;

      object-fit: contain;

      border-radius: 14px;

      margin-top: 18px;

      background: white;

    }


    .image-status {

      display: none;

      margin-top: 12px;

      color: #15803d;

      font-weight: 700;

      font-size: 15px;

    }


    /* =========================
       BUTTON
       ========================= */

    button {

      width: 100%;

      margin-top: 20px;

      border: 0;

      border-radius: 16px;

      padding: 17px;

      font-size: 20px;

      font-weight: 700;

      background: #2563eb;

      color: white;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    button:active {

      transform: scale(0.995);

    }


    button:disabled {

      opacity: 0.55;

      cursor: not-allowed;

      transform: none;

    }


    /* =========================
       LOADING
       ========================= */

    .loading {

      display: none;

      text-align: center;

      padding:
        22px 10px;

      color: #475569;

      font-size: 17px;

      font-weight: 600;

    }


    /* =========================
       ANSWER BOX
       ========================= */

    .answer {

      display: none;

      margin-top: 20px;

      background: #eef4ff;

      border:
        1px solid #dbeafe;

      border-radius: 18px;

      padding: 22px;

      font-size: 18px;

      line-height: 2;

      direction: rtl;

      text-align: right;

      overflow-wrap: break-word;

      word-break: normal;

    }


    /* =========================
       ARABIC TEXT
       ========================= */

    .text-line {

      display: block;

      width: 100%;

      direction: rtl;

      text-align: right;

      unicode-bidi: plaintext;

      margin:
        0 0 8px;

    }


    /* =========================
       EMPTY LINE
       ========================= */

    .empty-line {

      height: 10px;

    }


    /* =========================
       DISPLAY MATH
       ========================= */

    .display-math {

      width: 100%;

      direction: ltr;

      text-align: center;

      unicode-bidi: isolate;

      margin:
        14px 0;

      padding:
        5px 0;

      overflow-x: auto;

      overflow-y: hidden;

      -webkit-overflow-scrolling:
        touch;

    }


    /* =========================
       MATHJAX
       ========================= */

    .answer mjx-container {

      direction: ltr !important;

      unicode-bidi: isolate;

      max-width: 100%;

    }


    .answer
    mjx-container[display="true"] {

      display: block !important;

      direction: ltr !important;

      text-align: center !important;

      margin:
        10px auto !important;

      overflow-x: auto;

      overflow-y: hidden;

      max-width: 100%;

      padding:
        3px 0;

    }


    /*
     * Inline math inside Arabic
     */

    .text-line
    mjx-container {

      direction: ltr !important;

      unicode-bidi: isolate;

      display: inline-block !important;

      margin:
        0 3px !important;

    }


    /* =========================
       ERROR
       ========================= */

    .answer.error {

      background: #fff1f2;

      border-color: #fecdd3;

      color: #9f1239;

      direction: rtl;

      text-align: right;

      white-space: pre-wrap;

    }


    /* =========================
       NOTE
       ========================= */

    .note {

      font-size: 14px;

      color: #64748b;

      margin-top: 14px;

      text-align: center;

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .header {

        padding:
          38px 16px 55px;

      }


      .logo {

        font-size: 36px;

      }


      .card {

        padding: 20px;

      }


      h2 {

        font-size: 22px;

      }


      .answer {

        padding:
          19px 16px;

        font-size: 17px;

        line-height: 2;

      }


      .display-math {

        margin:
          12px 0;

      }

    }

  </style>

</head>



<body>


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <div class="logo">
      ONE Study
    </div>

    <div class="subtitle">
      مساعدك الدراسي بالذكاء الاصطناعي
    </div>

  </div>



  <!-- =========================
       MAIN
       ========================= -->

  <div class="container">

    <div class="card">


      <h2>
        ما السؤال الذي تريد حله؟
      </h2>


      <textarea
        id="question"
        placeholder="اكتب السؤال هنا..."
      ></textarea>



      <!-- =========================
           IMAGE
           ========================= -->

      <div class="image-box">


        <div class="image-title">
          📷 صوّر أو اختر صورة للسؤال
        </div>


        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
        >


        <div
          id="imageStatus"
          class="image-status"
        >
          ✓ تم اختيار الصورة
        </div>


        <img
          id="preview"
          alt="معاينة صورة السؤال"
        >


      </div>



      <!-- =========================
           ASK BUTTON
           ========================= -->

      <button
        id="askButton"
        type="button"
      >
        حل السؤال
      </button>



      <!-- =========================
           LOADING
           ========================= -->

      <div
        id="loading"
        class="loading"
      >
        جاري تحليل السؤال...
      </div>



      <!-- =========================
           ANSWER
           ========================= -->

      <div
        id="answer"
        class="answer"
      ></div>



      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>


    </div>

  </div>



<script>

(function () {

  "use strict";


  /* =========================
     SETTINGS
     ========================= */

  var API_URL = "/ask";


  /* =========================
     ELEMENTS
     ========================= */

  var questionInput =
    document.getElementById(
      "question"
    );


  var imageInput =
    document.getElementById(
      "imageInput"
    );


  var preview =
    document.getElementById(
      "preview"
    );


  var imageStatus =
    document.getElementById(
      "imageStatus"
    );


  var askButton =
    document.getElementById(
      "askButton"
    );


  var loading =
    document.getElementById(
      "loading"
    );


  var answer =
    document.getElementById(
      "answer"
    );


  /* =========================
     IMAGE -> BASE64
     ========================= */

  async function fileToDataURL(file) {


    var buffer =
      await file.arrayBuffer();


    var bytes =
      new Uint8Array(
        buffer
      );


    var binary =
      "";


    var chunkSize =
      0x8000;


    for (
      var i = 0;
      i < bytes.length;
      i += chunkSize
    ) {


      var chunk =
        bytes.subarray(

          i,

          Math.min(
            i + chunkSize,
            bytes.length
          )

        );


      binary +=
        String.fromCharCode.apply(
          null,
          chunk
        );

    }


    var base64 =
      btoa(
        binary
      );


    var mimeType =
      file.type ||
      "image/jpeg";


    return (
      "data:" +
      mimeType +
      ";base64," +
      base64
    );

  }


  /* =========================
     IMAGE SELECTION
     ========================= */

  imageInput.addEventListener(

    "change",

    function () {


      var file =
        imageInput.files &&
        imageInput.files.length > 0

          ? imageInput.files[0]

          : null;


      imageStatus.style.display =
        "none";


      preview.style.display =
        "none";


      preview.removeAttribute(
        "src"
      );


      if (!file) {

        return;

      }


      /* FILE TYPE */

      if (
        file.type &&
        file.type.indexOf(
          "image/"
        ) !== 0
      ) {


        imageInput.value =
          "";


        alert(
          "الملف المختار ليس صورة."
        );


        return;

      }


      /* MAX SIZE = 10MB */

      var maxSize =
        10 *
        1024 *
        1024;


      if (
        file.size >
        maxSize
      ) {


        imageInput.value =
          "";


        alert(
          "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
        );


        return;

      }


      imageStatus.style.display =
        "block";


      /* PREVIEW */

      if (
        window.URL &&
        window.URL.createObjectURL
      ) {


        var imageURL =
          window.URL.createObjectURL(
            file
          );


        preview.onload =
          function () {


            if (
              window.URL &&
              window.URL.revokeObjectURL
            ) {


              window.URL.revokeObjectURL(
                imageURL
              );

            }

          };


        preview.src =
          imageURL;


        preview.style.display =
          "block";

      }

    }

  );


  /* =========================
     SCROLL TO ANSWER
     ========================= */

  function scrollToAnswer() {


    try {


      answer.scrollIntoView({

        behavior:
          "smooth",

        block:
          "start"

      });


    } catch (error) {


      answer.scrollIntoView();

    }

  }


  /* =========================
     ERROR
     ========================= */

  function showError(message) {


    answer.innerHTML =
      "";


    answer.classList.add(
      "error"
    );


    answer.textContent =
      "تعذر الحصول على الإجابة:\n" +
      message;


    answer.style.display =
      "block";


    scrollToAnswer();

  }


  /* =========================
     CREATE TEXT LINE
     ========================= */

  function createTextLine(text) {


    var div =
      document.createElement(
        "div"
      );


    div.className =
      "text-line";


    div.setAttribute(
      "dir",
      "rtl"
    );


    /*
     * مهم:
     *
     * نستخدم textContent
     * وليس innerHTML
     *
     * حتى لا يتم تنفيذ
     * أي HTML يأتي من الإجابة.
     */

    div.textContent =
      text;


    return div;

  }


  /* =========================
     CREATE DISPLAY MATH
     ========================= */

  function createDisplayMath(math) {


    var div =
      document.createElement(
        "div"
      );


    div.className =
      "display-math";


    div.setAttribute(
      "dir",
      "ltr"
    );


    /*
     * نعيد محددات MathJax
     */

    div.textContent =
      "\\[" +
      math +
      "\\]";


    return div;

  }


  /* =========================
     PARSE ANSWER
     ========================= */

  function parseAnswer(text) {


    answer.innerHTML =
      "";


    var source =
      String(
        text || ""
      );


    /*
     * توحيد أسطر النص
     */

    source =
      source
        .replace(
          /\r\n/g,
          "\n"
        )
        .replace(
          /\r/g,
          "\n"
        );


    /*
     * نبحث فقط عن:
     *
     * \[
     * equation
     * \]
     *
     * ولا نحاول اكتشاف
     * الرياضيات بأنفسنا.
     */

    var displayMathRegex =
      /\\\[([\s\S]*?)\\\]/g;


    var lastIndex =
      0;


    var match;


    while (
      (
        match =
          displayMathRegex.exec(
            source
          )
      ) !== null
    ) {


      /*
       * النص العربي
       * قبل المعادلة
       */

      var before =
        source.slice(
          lastIndex,
          match.index
        );


      appendTextBlock(
        before
      );


      /*
       * المعادلة
       */

      var math =
        match[1].trim();


      if (math) {


        answer.appendChild(
          createDisplayMath(
            math
          )
        );

      }


      lastIndex =
        displayMathRegex.lastIndex;

    }


    /*
     * بقية النص بعد
     * آخر معادلة
     */

    var remaining =
      source.slice(
        lastIndex
      );


    appendTextBlock(
      remaining
    );

  }


  /* =========================
     APPEND TEXT BLOCK
     ========================= */

  function appendTextBlock(text) {


    if (
      text === null ||
      text === undefined
    ) {

      return;

    }


    var lines =
      String(text)
        .split("\n");


    lines.forEach(

      function (line) {


        var cleanLine =
          line.trim();


        /*
         * EMPTY LINE
         */

        if (!cleanLine) {


          var empty =
            document.createElement(
              "div"
            );


          empty.className =
            "empty-line";


          answer.appendChild(
            empty
          );


          return;

        }


        /*
         * NORMAL ARABIC TEXT
         */

        answer.appendChild(
          createTextLine(
            cleanLine
          )
        );

      }

    );

  }


  /* =========================
     RENDER MATHJAX
     ========================= */

  function renderMath() {


    if (
      window.MathJax &&
      window.MathJax.typesetPromise
    ) {


      /*
       * تنظيف أي معالجة سابقة
       */

      if (
        window.MathJax.typesetClear
      ) {


        try {


          window.MathJax.typesetClear(
            [answer]
          );


        } catch (error) {


          console.log(
            "MathJax clear:",
            error
          );

        }

      }


      /*
       * معالجة الإجابة الجديدة
       */

      return window.MathJax
        .typesetPromise(
          [answer]
        )
        .catch(

          function (error) {


            console.error(
              "MathJax error:",
              error
            );

          }

        );

    }


    return Promise.resolve();

  }


  /* =========================
     SHOW ANSWER
     ========================= */

  async function showAnswer(text) {


    answer.classList.remove(
      "error"
    );


    /*
     * فصل النص والمعادلات
     */

    parseAnswer(
      text
    );


    answer.style.display =
      "block";


    /*
     * MathJax يعالج فقط
     * المعادلات المحددة
     */

    await renderMath();


    scrollToAnswer();

  }


  /* =========================
     ASK AI
     ========================= */

  async function askAI() {


    var question =
      questionInput.value
        .trim();


    var file =
      imageInput.files &&
      imageInput.files.length > 0

        ? imageInput.files[0]

        : null;


    /* =========================
       VALIDATION
       ========================= */

    if (
      !question &&
      !file
    ) {


      alert(
        "اكتب سؤالاً أو اختر صورة أولاً."
      );


      return;

    }


    /* =========================
       START
       ========================= */

    askButton.disabled =
      true;


    answer.style.display =
      "none";


    answer.innerHTML =
      "";


    answer.classList.remove(
      "error"
    );


    loading.style.display =
      "block";


    loading.textContent =
      "جاري تحليل السؤال...";


    try {


      var imageData =
        null;


      /* =========================
         IMAGE
         ========================= */

      if (file) {


        loading.textContent =
          "جاري تجهيز الصورة...";


        imageData =
          await fileToDataURL(
            file
          );

      }


      loading.textContent =
        file

          ? "جاري تحليل السؤال والصورة..."

          : "جاري تحليل السؤال...";


      /* =========================
         FETCH
         ========================= */

      var response =
        await fetch(

          API_URL,

          {

            method:
              "POST",


            headers: {

              "Content-Type":
                "application/json"

            },


            body:
              JSON.stringify({

                question:
                  question,

                image:
                  imageData

              })

          }

        );


      /* =========================
         RESPONSE
         ========================= */

      var responseText =
        await response.text();


      var data;


      try {


        data =
          JSON.parse(
            responseText
          );


      } catch (error) {


        throw new Error(
          "الخادم أعاد استجابة غير صالحة."
        );

      }


      /* =========================
         SERVER ERROR
         ========================= */

      if (
        !response.ok
      ) {


        throw new Error(

          data.error ||

          "حدث خطأ أثناء معالجة السؤال."

        );

      }


      /* =========================
         ANSWER
         ========================= */

      var finalAnswer =

        data.answer ||

        data.output ||

        data.response;


      if (
        !finalAnswer
      ) {


        throw new Error(
          "تم الاتصال بالخادم ولكن لم تصل إجابة."
        );

      }


      /* =========================
         DISPLAY
         ========================= */

      await showAnswer(
        finalAnswer
      );


    } catch (error) {


      console.error(
        "ONE STUDY ERROR:",
        error
      );


      showError(

        error &&
        error.message

          ? error.message

          : "حدث خطأ غير معروف."

      );


    } finally {


      /* =========================
         FINISH
         ========================= */

      loading.style.display =
        "none";


      loading.textContent =
        "جاري تحليل السؤال...";


      askButton.disabled =
        false;

    }

  }


  /* =========================
     BUTTON EVENT
     ========================= */

  askButton.addEventListener(

    "click",

    function () {


      askAI();

    }

  );


})();

</script>


</body>

</html>
