<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONE Study</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 40px 20px 55px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 16px;
      opacity: .9;
    }

    .container {
      max-width: 700px;
      margin: -30px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid #dbe2ea;
      border-radius: 15px;
      padding: 16px;
      font-size: 17px;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .image-box {
      margin-top: 15px;
      border: 2px dashed #cbd5e1;
      border-radius: 15px;
      padding: 18px;
      text-align: center;
      background: #f8fafc;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 10px;
    }

    #preview {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 15px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .answer {
      display: none;
      margin-top: 20px;
      background: #eef4ff;
      border-radius: 15px;
      padding: 18px;
      line-height: 1.9;
      white-space: pre-wrap;
text-align: right;
direction: rtl;
unicode-bidi: plaintext;
}
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #475569;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">ONE Study</div>
    <div class="subtitle">مساعدك الدراسي بالذكاء الاصطناعي</div>
  </div>

  <div class="container">

    <div class="card">

      <h2>ما السؤال الذي تريد حله؟</h2>

      <textarea
        id="question"
        placeholder="اكتب السؤال هنا..."
      ></textarea>

      <div class="image-box">
        📷
        <strong>صوّر أو اختر صورة للسؤال</strong>

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
        >

        <img id="preview">
      </div>

      <button id="askButton" onclick="askAI()">
        حل السؤال
      </button>

      <div id="loading" class="loading">
        جاري تحليل السؤال...
      </div>

      <div id="answer" class="answer"></div>

      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>

    </div>

  </div>

<script>

const API_URL = "/ask";

let selectedImage = null;

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (event) {

    selectedImage = event.target.result;

    preview.src = selectedImage;
    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


async function askAI() {

  const question =
    document.getElementById("question").value.trim();

  const button =
    document.getElementById("askButton");

  const loading =
    document.getElementById("loading");

  const answer =
    document.getElementById("answer");


  if (!question && !selectedImage) {

    alert("اكتب سؤالاً أو اختر صورة أولاً.");
    return;

  }


  button.disabled = true;

  loading.style.display = "block";

  answer.style.display = "none";


  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        question: question,

        image: selectedImage

      })

    });


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "حدث خطأ أثناء معالجة السؤال."
      );

    }


    answer.textContent =
      data.answer ||
      data.output ||
      data.response ||
      "تمت معالجة الطلب ولكن لم تصل إجابة.";

    answer.style.display = "block";


  } catch (error) {

    answer.textContent =
      "تعذر الحصول على الإجابة: " +
      error.message;

    answer.style.display = "block";

  } finally {

    loading.style.display = "none";

    button.disabled = false;

  }

}

</script>

</body>
</html>
