<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ONE Study</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      padding: 42px 20px 58px;
      text-align: center;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: -32px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 23px;
      text-align: right;
    }

    textarea {
      width: 100%;
      min-height: 155px;
      border: 1px solid #dbe2ea;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      direction: rtl;
      text-align: right;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .image-box {
      margin-top: 17px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      background: #f8fafc;
    }

    .image-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    input[type="file"] {
      width: 100%;
      font-size: 15px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 14px;
      margin-top: 18px;
      background: white;
    }

    .image-status {
      display: none;
      margin-top: 10px;
      font-size: 14px;
      color: #166534;
      font-weight: 600;
    }

    button {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 16px;
      padding: 17px;
      font-size: 20px;
      font-weight: 700;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 22px 10px;
      color: #475569;
      font-size: 16px;
    }

    .answer {
      display: none;
      margin-top: 20px;
      background: #eef4ff;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 20px;
      line-height: 1.9;
      font-size: 17px;
      white-space: pre-wrap;
      text-align: right;
      direction: rtl;
      unicode-bidi: plaintext;
      overflow-wrap: anywhere;
    }

    .error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;
    }

    .note {
      font-size: 14px;
      color: #64748b;
      margin-top: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header {
        padding: 38px 16px 55px;
      }

      .logo {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">ONE Study</div>

    <div class="subtitle">
      مساعدك الدراسي بالذكاء الاصطناعي
    </div>
  </div>


  <div class="container">

    <div class="card">

      <h2>
        ما السؤال الذي تريد حله؟
      </h2>


      <textarea
        id="question"
        placeholder="اكتب السؤال هنا..."
      ></textarea>


      <div class="image-box">

        <div class="image-title">
          📷 صوّر أو اختر صورة للسؤال
        </div>

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
        >

        <div
          id="imageStatus"
          class="image-status"
        >
          ✓ تم اختيار الصورة
        </div>

        <img
          id="preview"
          alt="معاينة صورة السؤال"
        >

      </div>


      <button
        id="askButton"
        type="button"
      >
        حل السؤال
      </button>


      <div
        id="loading"
        class="loading"
      >
        جاري تحليل السؤال والصورة...
      </div>


      <div
        id="answer"
        class="answer"
      ></div>


      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>

    </div>

  </div>


<script>

const API_URL = "/ask";


const questionInput =
  document.getElementById("question");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const imageStatus =
  document.getElementById("imageStatus");

const askButton =
  document.getElementById("askButton");

const loading =
  document.getElementById("loading");

const answer =
  document.getElementById("answer");


/*
  تحويل ملف الصورة إلى Data URL.

  هذه الدالة لا تعتمد على متغير selectedImage
  قد لا يكون جاهزاً.

  بل تنتظر فعلياً حتى ينتهي FileReader.
*/

async function fileToDataURL(file) {

  if (!file) {
    return null;
  }

  try {

    const buffer =
      await file.arrayBuffer();

    const bytes =
      new Uint8Array(buffer);

    const chunkSize =
      0x8000;

    let binary = "";

    for (
      let i = 0;
      i < bytes.length;
      i += chunkSize
    ) {

      const chunk =
        bytes.subarray(
          i,
          Math.min(
            i + chunkSize,
            bytes.length
          )
        );

      binary +=
        String.fromCharCode.apply(
          null,
          chunk
        );
    }

    const base64 =
      btoa(binary);

    return (
      "data:" +
      (file.type || "image/jpeg") +
      ";base64," +
      base64
    );

  } catch (error) {

    console.error(
      "IMAGE READ ERROR:",
      error
    );

    throw new Error(
      "تعذر تجهيز الصورة للإرسال."
    );
  }
}.

  هذه المعاينة مستقلة عن عملية الإرسال.
*/

imageInput.addEventListener(
  "change",
  function () {

    const file =
      imageInput.files?.[0];


    preview.style.display =
      "none";

    preview.removeAttribute("src");

    imageStatus.style.display =
      "none";


    if (!file) {
      return;
    }


    if (
      !file.type ||
      !file.type.startsWith("image/")
    ) {

      imageInput.value = "";

      alert(
        "الملف المختار ليس صورة."
      );

      return;
    }


    const maxSize =
      10 * 1024 * 1024;


    if (file.size > maxSize) {

      imageInput.value = "";

      alert(
        "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
      );

      return;
    }


    imageStatus.style.display =
      "block";


    /*
      Object URL للمعاينة فقط.
      أسرع وأكثر ثباتاً على iPhone.
    */

    const objectURL =
      URL.createObjectURL(file);


    preview.onload = function () {

      URL.revokeObjectURL(
        objectURL
      );

    };


    preview.src =
      objectURL;

    preview.style.display =
      "block";

  }
);


/*
  إرسال السؤال
*/

async function askAI() {

  const question =
    questionInput.value.trim();

  const file =
    imageInput.files?.[0] || null;


  /*
    يجب وجود سؤال أو صورة.
  */

  if (!question && !file) {

    alert(
      "اكتب سؤالاً أو اختر صورة أولاً."
    );

    return;
  }


  /*
    التحقق من الصورة قبل الإرسال.
  */

  if (file) {

    if (
      !file.type ||
      !file.type.startsWith("image/")
    ) {

      alert(
        "الملف المختار ليس صورة."
      );

      return;
    }


    const maxSize =
      10 * 1024 * 1024;


    if (file.size > maxSize) {

      alert(
        "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
      );

      return;
    }

  }


  askButton.disabled =
    true;

  loading.style.display =
    "block";

  answer.style.display =
    "none";

  answer.classList.remove(
    "error"
  );

  answer.textContent = "";


  try {

    /*
      إذا توجد صورة:
      انتظر فعلياً حتى تتحول إلى Data URL.

      لا يمكن إرسال الطلب قبل اكتمال القراءة.
    */

    let imageData =
      null;


    if (file) {

      loading.textContent =
        "جاري تجهيز الصورة...";


      imageData =
        await fileToDataURL(file);

    }


    loading.textContent =
      "جاري تحليل السؤال والصورة...";


    /*
      إرسال البيانات إلى server.js
    */

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              question:
                question,

              image:
                imageData

            })

        }
      );


    /*
      قراءة رد الخادم كنص أولاً.

      هذا يمنع تعطل الصفحة إذا أعاد
      الخادم HTML أو رسالة غير JSON.
    */

    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    } catch (jsonError) {

      console.error(
        "SERVER RESPONSE:",
        responseText
      );


      throw new Error(
        "الخادم أعاد استجابة غير صالحة."
      );

    }


    /*
      إذا أعاد الخادم خطأ.
    */

    if (!response.ok) {

      throw new Error(

        data.error ||
        "حدث خطأ أثناء معالجة السؤال."

      );

    }


    /*
      استخراج الإجابة.
    */

    const finalAnswer =

      data.answer ||

      data.output ||

      data.response;


    if (!finalAnswer) {

      throw new Error(
        "تم الاتصال بالخادم ولكن لم تصل إجابة."
      );

    }


    /*
      عرض الإجابة.
    */

    answer.textContent =
      finalAnswer;

    answer.style.display =
      "block";


    /*
      تمرير الصفحة إلى الإجابة.
    */

    answer.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });


  } catch (error) {

    console.error(
      "ONE STUDY ERROR:",
      error
    );


    answer.classList.add(
      "error"
    );


    answer.textContent =

      "تعذر الحصول على الإجابة:\n" +

      (
        error?.message ||
        "حدث خطأ غير معروف."
      );


    answer.style.display =
      "block";


    answer.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });


  } finally {

    loading.style.display =
      "none";


    loading.textContent =
      "جاري تحليل السؤال والصورة...";


    askButton.disabled =
      false;

  }

}


/*
  تشغيل الزر
*/

askButton.addEventListener(
  "click",
  askAI
);

</script>

</body>
</html>
