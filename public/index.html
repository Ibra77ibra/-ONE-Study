<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>ONE Study</title>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ["\\(", "\\)"]
        ],
        displayMath: [
          ["\\[", "\\]"]
        ]
      },

      options: {
        skipHtmlTags: [
          "script",
          "noscript",
          "style",
          "textarea",
          "pre",
          "code"
        ]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f4f7fb;
      color: #172033;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #4f46e5
        );

      color: white;

      padding:
        42px 20px 58px;

      text-align: center;
    }


    .logo {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }


    .subtitle {
      font-size: 17px;
      opacity: 0.9;
    }


    /* =========================
       CONTAINER
       ========================= */

    .container {
      max-width: 700px;

      margin:
        -32px auto 40px;

      padding:
        0 16px;
    }


    .card {
      background: white;

      border-radius: 24px;

      padding: 24px;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.08);
    }


    h2 {
      margin:
        0 0 20px;

      font-size: 23px;

      text-align: right;
    }


    /* =========================
       QUESTION
       ========================= */

    textarea {
      width: 100%;

      min-height: 155px;

      border:
        1px solid #dbe2ea;

      border-radius: 16px;

      padding: 16px;

      font-size: 17px;

      resize: vertical;

      outline: none;

      font-family: inherit;

      direction: rtl;

      text-align: right;
    }


    textarea:focus {
      border-color: #2563eb;
    }


    /* =========================
       IMAGE
       ========================= */

    .image-box {
      margin-top: 17px;

      border:
        2px dashed #cbd5e1;

      border-radius: 16px;

      padding: 20px;

      text-align: center;

      background: #f8fafc;
    }


    .image-title {
      font-size: 17px;

      font-weight: 700;

      margin-bottom: 14px;
    }


    input[type="file"] {
      width: 100%;

      font-size: 15px;
    }


    #preview {
      display: none;

      width: 100%;

      max-height: 400px;

      object-fit: contain;

      border-radius: 14px;

      margin-top: 18px;

      background: white;
    }


    .image-status {
      display: none;

      margin-top: 12px;

      color: #15803d;

      font-weight: 700;

      font-size: 15px;
    }


    /* =========================
       BUTTON
       ========================= */

    button {
      width: 100%;

      margin-top: 20px;

      border: 0;

      border-radius: 16px;

      padding: 17px;

      font-size: 20px;

      font-weight: 700;

      background: #2563eb;

      color: white;

      cursor: pointer;
    }


    button:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }


    /* =========================
       LOADING
       ========================= */

    .loading {
      display: none;

      text-align: center;

      padding:
        22px 10px;

      color: #475569;

      font-size: 17px;

      font-weight: 600;
    }


    /* =========================
       ANSWER
       ========================= */

    .answer {
      display: none;

      margin-top: 20px;

      background: #eef4ff;

      border:
        1px solid #dbeafe;

      border-radius: 18px;

      padding: 22px;

      font-size: 18px;

      line-height: 2;

      text-align: right;

      direction: rtl;

      overflow-wrap: break-word;

      word-break: normal;
    }


    .answer-line {
      display: block;

      width: 100%;

      margin:
        0 0 10px;

      direction: rtl;

      text-align: right;

      unicode-bidi: plaintext;
    }


    .answer-line:last-child {
      margin-bottom: 0;
    }


    /*
     * الأسطر الرياضية الخالصة
     */
    .math-line {
      direction: ltr;

      text-align: center;

      unicode-bidi: isolate;

      margin:
        14px 0;

      overflow-x: auto;

      overflow-y: hidden;

      padding:
        4px 2px;
    }


    /*
     * MathJax
     */
    .answer mjx-container {
      max-width: 100%;
    }


    .answer mjx-container[display="true"] {
      overflow-x: auto;

      overflow-y: hidden;

      margin:
        14px 0 !important;

      padding:
        4px 0;

      text-align: center !important;
    }


    .answer.error {
      background: #fff1f2;

      border-color: #fecdd3;

      color: #9f1239;

      direction: rtl;

      text-align: right;
    }


    /* =========================
       NOTE
       ========================= */

    .note {
      font-size: 14px;

      color: #64748b;

      margin-top: 14px;

      text-align: center;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .header {
        padding:
          38px 16px 55px;
      }


      .logo {
        font-size: 36px;
      }


      .card {
        padding: 20px;
      }


      h2 {
        font-size: 22px;
      }


      .answer {
        padding: 18px;

        font-size: 17px;

        line-height: 2;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <div class="logo">
      ONE Study
    </div>

    <div class="subtitle">
      مساعدك الدراسي بالذكاء الاصطناعي
    </div>

  </div>


  <!-- =========================
       MAIN
       ========================= -->

  <div class="container">

    <div class="card">


      <h2>
        ما السؤال الذي تريد حله؟
      </h2>


      <textarea
        id="question"
        placeholder="اكتب السؤال هنا..."
      ></textarea>


      <!-- IMAGE -->

      <div class="image-box">

        <div class="image-title">
          📷 صوّر أو اختر صورة للسؤال
        </div>


        <input
          id="imageInput"
          type="file"
          accept="image/*"
          capture="environment"
        >


        <div
          id="imageStatus"
          class="image-status"
        >
          ✓ تم اختيار الصورة
        </div>


        <img
          id="preview"
          alt="معاينة صورة السؤال"
        >

      </div>


      <!-- BUTTON -->

      <button
        id="askButton"
        type="button"
      >
        حل السؤال
      </button>


      <!-- LOADING -->

      <div
        id="loading"
        class="loading"
      >
        جاري تحليل السؤال...
      </div>


      <!-- ANSWER -->

      <div
        id="answer"
        class="answer"
      ></div>


      <div class="note">
        راجع الإجابات المهمة وتأكد منها من مصادرك الدراسية.
      </div>


    </div>

  </div>


<script>

(function () {

  "use strict";


  /* =========================
     ELEMENTS
     ========================= */

  var API_URL = "/ask";


  var questionInput =
    document.getElementById(
      "question"
    );


  var imageInput =
    document.getElementById(
      "imageInput"
    );


  var preview =
    document.getElementById(
      "preview"
    );


  var imageStatus =
    document.getElementById(
      "imageStatus"
    );


  var askButton =
    document.getElementById(
      "askButton"
    );


  var loading =
    document.getElementById(
      "loading"
    );


  var answer =
    document.getElementById(
      "answer"
    );


  /* =========================
     IMAGE TO BASE64
     ========================= */

  async function fileToDataURL(file) {

    var buffer =
      await file.arrayBuffer();


    var bytes =
      new Uint8Array(
        buffer
      );


    var binary = "";


    var chunkSize =
      0x8000;


    for (
      var i = 0;
      i < bytes.length;
      i += chunkSize
    ) {

      var chunk =
        bytes.subarray(
          i,
          Math.min(
            i + chunkSize,
            bytes.length
          )
        );


      binary +=
        String.fromCharCode.apply(
          null,
          chunk
        );

    }


    var base64 =
      btoa(
        binary
      );


    var mimeType =
      file.type ||
      "image/jpeg";


    return (
      "data:" +
      mimeType +
      ";base64," +
      base64
    );

  }


  /* =========================
     IMAGE PREVIEW
     ========================= */

  imageInput.addEventListener(
    "change",
    function () {


      var file =
        imageInput.files &&
        imageInput.files.length > 0

          ? imageInput.files[0]

          : null;


      imageStatus.style.display =
        "none";


      preview.style.display =
        "none";


      preview.removeAttribute(
        "src"
      );


      if (!file) {

        return;

      }


      /*
       * التأكد من أنه ملف صورة
       */

      if (
        file.type &&
        file.type.indexOf(
          "image/"
        ) !== 0
      ) {

        imageInput.value =
          "";


        alert(
          "الملف المختار ليس صورة."
        );


        return;

      }


      /*
       * الحد الأقصى 10MB
       */

      var maxSize =
        10 *
        1024 *
        1024;


      if (
        file.size >
        maxSize
      ) {

        imageInput.value =
          "";


        alert(
          "حجم الصورة كبير جداً. اختر صورة أصغر من 10 MB."
        );


        return;

      }


      imageStatus.style.display =
        "block";


      /*
       * معاينة الصورة
       */

      if (
        window.URL &&
        window.URL.createObjectURL
      ) {


        var imageURL =
          window.URL.createObjectURL(
            file
          );


        preview.onload =
          function () {


            if (
              window.URL &&
              window.URL.revokeObjectURL
            ) {

              window.URL.revokeObjectURL(
                imageURL
              );

            }

          };


        preview.src =
          imageURL;


        preview.style.display =
          "block";

      }

    }
  );


  /* =========================
     ERROR
     ========================= */

  function showError(message) {


    answer.innerHTML =
      "";


    answer.classList.add(
      "error"
    );


    var errorText =
      document.createElement(
        "div"
      );


    errorText.textContent =
      "تعذر الحصول على الإجابة:\n" +
      message;


    errorText.style.whiteSpace =
      "pre-wrap";


    answer.appendChild(
      errorText
    );


    answer.style.display =
      "block";


    scrollToAnswer();

  }


  /* =========================
     DETECT MATH
     ========================= */

  function looksLikeMath(line) {


    var text =
      line.trim();


    if (!text) {

      return false;

    }


    /*
     * السطر يعتبر رياضياً إذا
     * كان أغلبه أرقام ورموز
     * أو يحتوي على معادلة واضحة.
     */

    var hasEquation =
      /[=±√^]/.test(
        text
      );


    var hasMathVariable =
      /(?:^|\s)[a-zA-Z]\s*[=(+\-]/.test(
        text
      );


    return (
      hasEquation ||
      hasMathVariable
    );

  }


  /* =========================
     CONVERT COMMON MATH
     TO LATEX
     ========================= */

  function convertMath(text) {


    var result =
      String(text);


    /*
     * الجذور
     *
     * √2
     * يصبح
     * \sqrt{2}
     */

    result =
      result.replace(
        /√\s*\(?([0-9a-zA-Z]+)\)?/g,
        "\\sqrt{$1}"
      );


    /*
     * القوى البسيطة
     *
     * x^2
     * x^3
     */

    result =
      result.replace(
        /([a-zA-Z0-9\)])\^([0-9]+)/g,
        "$1^{$2}"
      );


    /*
     * علامة الضرب
     */

    result =
      result.replace(
        /×/g,
        "\\times "
      );


    /*
     * علامة لا يساوي
     */

    result =
      result.replace(
        /≠/g,
        "\\ne "
      );


    /*
     * أصغر أو يساوي
     */

    result =
      result.replace(
        /≤/g,
        "\\le "
      );


    /*
     * أكبر أو يساوي
     */

    result =
      result.replace(
        /≥/g,
        "\\ge "
      );


    /*
     * السهم
     */

    result =
      result.replace(
        /⇒/g,
        "\\Rightarrow "
      );


    /*
     * زائد أو ناقص
     */

    result =
      result.replace(
        /±/g,
        "\\pm "
      );


    return result;

  }


  /* =========================
     CREATE NORMAL LINE
     ========================= */

  function createNormalLine(
    text
  ) {


    var div =
      document.createElement(
        "div"
      );


    div.className =
      "answer-line";


    div.setAttribute(
      "dir",
      "auto"
    );


    div.style.unicodeBidi =
      "plaintext";


    div.textContent =
      text;


    return div;

  }


  /* =========================
     CREATE MATH LINE
     ========================= */

  function createMathLine(
    text
  ) {


    var div =
      document.createElement(
        "div"
      );


    div.className =
      "math-line";


    div.setAttribute(
      "dir",
      "ltr"
    );


    var mathText =
      convertMath(
        text
      );


    div.textContent =
      "\\[" +
      mathText +
      "\\]";


    return div;

  }


  /* =========================
     SHOW ANSWER
     ========================= */

  function showAnswer(text) {


    answer.classList.remove(
      "error"
    );


    answer.innerHTML =
      "";


    var lines =
      String(text)
        .replace(/\r/g, "")
        .split("\n");


    lines.forEach(
      function (line) {


        var cleanLine =
          line.trim();


        /*
         * سطر فارغ
         */

        if (
          cleanLine === ""
        ) {


          var space =
            document.createElement(
              "div"
            );


          space.style.height =
            "12px";


          answer.appendChild(
            space
          );


          return;

        }


        /*
         * السطر الرياضي
         */

        if (
          looksLikeMath(
            cleanLine
          )
        ) {


          answer.appendChild(
            createMathLine(
              cleanLine
            )
          );


        } else {


          answer.appendChild(
            createNormalLine(
              cleanLine
            )
          );

        }

      }
    );


    answer.style.display =
      "block";


    /*
     * تشغيل MathJax
     * بعد إدخال الإجابة
     */

    renderMath();


    scrollToAnswer();

  }


  /* =========================
     RENDER MATHJAX
     ========================= */

  function renderMath() {


    if (
      window.MathJax &&
      window.MathJax.typesetPromise
    ) {


      window.MathJax
        .typesetPromise(
          [answer]
        )
        .catch(
          function (error) {

            console.error(
              "MathJax error:",
              error
            );

          }
        );

    }

  }


  /* =========================
     SCROLL
     ========================= */

  function scrollToAnswer() {


    try {


      answer.scrollIntoView({

        behavior:
          "smooth",

        block:
          "start"

      });


    } catch (e) {


      answer.scrollIntoView();

    }

  }


  /* =========================
     ASK AI
     ========================= */

  async function askAI() {


    var question =
      questionInput.value.trim();


    var file =
      imageInput.files &&
      imageInput.files.length > 0

        ? imageInput.files[0]

        : null;


    /*
     * لا يوجد سؤال أو صورة
     */

    if (
      !question &&
      !file
    ) {


      alert(
        "اكتب سؤالاً أو اختر صورة أولاً."
      );


      return;

    }


    /*
     * بداية التحميل
     */

    askButton.disabled =
      true;


    answer.style.display =
      "none";


    answer.innerHTML =
      "";


    answer.classList.remove(
      "error"
    );


    loading.style.display =
      "block";


    try {


      var imageData =
        null;


      /*
       * تجهيز الصورة
       */

      if (file) {


        loading.textContent =
          "جاري تجهيز الصورة...";


        imageData =
          await fileToDataURL(
            file
          );

      }


      loading.textContent =
        file
          ? "جاري تحليل السؤال والصورة..."
          : "جاري تحليل السؤال...";


      /*
       * إرسال السؤال إلى الخادم
       */

      var response =
        await fetch(

          API_URL,

          {

            method:
              "POST",


            headers: {

              "Content-Type":
                "application/json"

            },


            body:
              JSON.stringify({

                question:
                  question,

                image:
                  imageData

              })

          }

        );


      /*
       * قراءة استجابة الخادم
       */

      var responseText =
        await response.text();


      var data;


      try {


        data =
          JSON.parse(
            responseText
          );


      } catch (e) {


        throw new Error(
          "الخادم أعاد استجابة غير صالحة."
        );

      }


      /*
       * خطأ من الخادم
       */

      if (
        !response.ok
      ) {


        throw new Error(

          data.error ||

          "حدث خطأ أثناء معالجة السؤال."

        );

      }


      /*
       * استخراج الإجابة
       */

      var finalAnswer =

        data.answer ||

        data.output ||

        data.response;


      if (
        !finalAnswer
      ) {


        throw new Error(
          "تم الاتصال بالخادم ولكن لم تصل إجابة."
        );

      }


      /*
       * عرض الإجابة
       */

      showAnswer(
        finalAnswer
      );


    } catch (error) {


      console.error(
        "ONE STUDY ERROR:",
        error
      );


      showError(

        error &&
        error.message

          ? error.message

          : "حدث خطأ غير معروف."

      );


    } finally {


      loading.style.display =
        "none";


      loading.textContent =
        "جاري تحليل السؤال...";


      askButton.disabled =
        false;

    }

  }


  /* =========================
     BUTTON
     ========================= */

  askButton.addEventListener(

    "click",

    function () {

      askAI();

    }

  );


})();

</script>


</body>

</html>
